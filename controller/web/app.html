<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D2B5E">
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="icon" href="/app/icon-192.png">
<link rel="apple-touch-icon" href="/app/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SampleNet">
<title>SampleNet</title>
<style>
/* SampleNet Fibre: the household app an Indian ISP gives its broadband customers.
   Ink-indigo brand with a marigold accent, Mukta (an Indian typeface with Latin and Devanagari),
   phone first. The memorable element is "the line": the plan's capacity drawn as a pipe that fills
   with what each device is using right now. */
@font-face{font-family:"Mukta";src:url(/fonts/mukta-400.woff) format("woff");font-weight:400;font-display:swap}
@font-face{font-family:"Mukta";src:url(/fonts/mukta-500.woff) format("woff");font-weight:500;font-display:swap}
@font-face{font-family:"Mukta";src:url(/fonts/mukta-600.woff) format("woff");font-weight:600;font-display:swap}
@font-face{font-family:"Mukta";src:url(/fonts/mukta-700.woff) format("woff");font-weight:700;font-display:swap}
:root{
  --indigo:#1D2B5E; --indigo-2:#2A3B78; --indigo-ink:#FFFFFF; --indigo-soft:#C9D0EC;
  --marigold:#F2A93B; --marigold-ink:#3A2500; --marigold-soft:#FDF0D9;
  --paper:#F3F4F8; --card:#FFFFFF; --well:#EAECF3; --line:#DDE0EA;
  --text:#191D2C; --muted:#585F75; --faint:#8A90A3;
  --good:#1E8A5A; --good-soft:#E2F3EA; --watch:#A86A00; --watch-soft:#FBF0DA; --bad:#BD3B12; --bad-soft:#FBE6DE;
  /* what devices are doing (same families as the router console) */
  --a-call:#2FB37B; --a-video:#5B8DEF; --a-stream:#9C7BF2; --a-dl:#E46A8E; --a-web:#E0A33A; --a-idle:#B8BDCB;
  --font:"Mukta",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --indigo:#1A2552; --indigo-2:#26346A; --paper:#0F1326; --card:#181D35; --well:#212844; --line:#2A3253;
    --text:#E9ECF6; --muted:#A5ACC4; --faint:#747C98; --marigold-soft:#3A2C12;
    --good:#55C98E; --good-soft:#15301F; --watch:#E6B451; --watch-soft:#33270D; --bad:#F07E57; --bad-soft:#3A1B10; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --indigo:#1A2552; --indigo-2:#26346A; --paper:#0F1326; --card:#181D35; --well:#212844; --line:#2A3253;
  --text:#E9ECF6; --muted:#A5ACC4; --faint:#747C98; --marigold-soft:#3A2C12;
  --good:#55C98E; --good-soft:#15301F; --watch:#E6B451; --watch-soft:#33270D; --bad:#F07E57; --bad-soft:#3A1B10; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--marigold);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
h1{font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.01em}
h2{font-size:19px;line-height:1.2;font-weight:700}
h3{font-size:16px;font-weight:600}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.shell{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--paper)}
@media (min-width:600px){body{background:var(--well)} .shell{box-shadow:0 0 0 1px var(--line)}}

/* top bar */
.top{background:var(--indigo);color:var(--indigo-ink);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.mark{display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit}
.mark b{font-size:21px;font-weight:700;letter-spacing:-.01em}
.mark small{font-size:13px;color:var(--indigo-soft);font-weight:500;margin-left:-3px}
.top .sp{flex:1}
.iconbtn{position:relative;background:transparent;border:0;color:inherit;cursor:pointer;padding:7px;border-radius:12px;display:grid;place-items:center}
.iconbtn:hover{background:rgba(255,255,255,.08)}
.lang{border:1px solid rgba(255,255,255,.35);background:transparent;color:inherit;border-radius:999px;padding:2px 11px;font-weight:600;font-size:14px;cursor:pointer}
.badge{position:absolute;top:2px;right:2px;background:var(--marigold);color:var(--marigold-ink);border-radius:999px;font-size:11px;font-weight:700;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}

main{flex:1;padding:16px 16px calc(100px + env(safe-area-inset-bottom,0px));display:grid;gap:16px;align-content:start}
.hello{display:flex;align-items:end;gap:12px}
.hello h1{font-size:24px}
.hello p{color:var(--muted);font-size:14.5px}

/* the line (hero) */
.linecard{background:var(--indigo);color:var(--indigo-ink);border-radius:22px;padding:18px 18px 16px;display:grid;gap:12px}
.state{display:flex;align-items:center;gap:10px}
.state .dot{width:12px;height:12px;border-radius:50%;background:var(--sc,var(--a-call));box-shadow:0 0 0 4px color-mix(in srgb,var(--sc,var(--a-call)) 30%,transparent);flex:none}
.linecard h2{font-size:23px}
.linecard p{color:var(--indigo-soft);font-size:15px}
.pipe{height:26px;border-radius:13px;background:rgba(255,255,255,.12);display:flex;overflow:hidden;gap:2px;padding:3px}
.pipe i{display:block;height:100%;border-radius:9px;min-width:6px;transition:flex-basis .6s ease}
.pipe-scale{display:flex;justify-content:space-between;font-size:13px;color:var(--indigo-soft);margin-top:-6px}
.legend{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}
.legend li{display:flex;align-items:center;gap:7px;font-size:14px;min-width:0}
.legend li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend li em{font-style:normal;color:var(--indigo-soft);margin-left:auto;white-space:nowrap}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.linefoot{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;color:var(--indigo-soft);border-top:1px solid rgba(255,255,255,.14);padding-top:10px}

/* quick actions */
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.quick button,.quick a{background:none;border:0;display:grid;justify-items:center;gap:6px;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;color:var(--text);padding:2px;text-align:center;line-height:1.2}
.quick .ic{width:54px;height:54px;border-radius:18px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--indigo)}
:root[data-theme="dark"] .quick .ic{color:var(--marigold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .quick .ic{color:var(--marigold)}}
.quick button:hover .ic,.quick a:hover .ic{border-color:var(--marigold)}

/* panels */
.panel{background:var(--card);border-radius:18px;border:1px solid var(--line);padding:16px;display:grid;gap:12px;min-width:0}
.panel-head{display:flex;align-items:center;gap:10px}
.panel-head .sp{flex:1}
.muted{color:var(--muted);font-size:14.5px}
.faint{color:var(--faint);font-size:13px}
.notice{border-radius:16px;padding:14px;display:grid;gap:4px;font-size:15px}
.notice b{font-size:16px}
.notice.bad{background:var(--bad-soft);color:var(--bad)} .notice.watch{background:var(--watch-soft);color:var(--watch)} .notice.good{background:var(--good-soft);color:var(--good)}
.notice span{color:var(--text)}

.btn{border:0;background:var(--indigo);color:#fff;border-radius:14px;padding:12px 18px;font-weight:600;cursor:pointer;font-size:16px;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.accent{background:var(--marigold);color:var(--marigold-ink)}
.btn.quiet{background:var(--well);color:var(--text)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--text)}
.btn.warn{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:7px 13px;font-size:14.5px;border-radius:11px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
:root[data-theme="dark"] .btn:not(.accent):not(.quiet):not(.line):not(.warn){background:var(--indigo-2)}

/* plan */
.plan{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:end}
.plan .price{font-size:28px;font-weight:700;line-height:1}
.plan .price small{font-size:14px;font-weight:500;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.facts div{background:var(--well);border-radius:12px;padding:9px 11px}
.facts b{display:block;font-size:17px}
.facts span{font-size:13px;color:var(--muted)}

/* boosts */
.boost{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center}
.ring{width:44px;height:44px}
.boost b{display:block}
.boost .clock{font-size:21px;font-weight:700;text-align:right}

/* lists */
.group h3{font-size:14px;font-weight:600;color:var(--muted);margin:0 0 4px}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer}
.row:last-child{border-bottom:0}
.tile{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc,var(--a-idle)) 16%,transparent);color:var(--tc,var(--muted))}
.row b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--muted);font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .num{text-align:right;font-size:14px;color:var(--muted);white-space:nowrap;line-height:1.3}
.row .num b{color:var(--text);font-size:15px;display:inline}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:0 6px;margin-right:4px;vertical-align:1px}
.tag.boost{background:var(--marigold);color:var(--marigold-ink)} .tag.paused{background:var(--watch-soft);color:var(--watch)}

/* choices */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--well);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:11px;padding:9px 6px;font-weight:600;cursor:pointer;font-size:15px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(20,25,50,.12)}
.step{display:grid;gap:8px}
.step > b{font-size:15px}
.step > b span{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--indigo);color:#fff;font-size:13px;margin-right:6px}
.who{display:grid;gap:6px}
.who button{display:grid;grid-template-columns:36px minmax(0,1fr) 22px;gap:10px;align-items:center;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:8px 10px;cursor:pointer;text-align:left}
.who button .tile{width:36px;height:36px;border-radius:11px}
.who button b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who button small{font-size:13px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who button .tick{width:20px;height:20px;border-radius:50%;border:2px solid var(--line)}
.who button[aria-pressed=true]{border-color:var(--indigo)}
.who button[aria-pressed=true] .tick{border:6px solid var(--indigo)}
:root[data-theme="dark"] .who button[aria-pressed=true]{border-color:var(--marigold)}
:root[data-theme="dark"] .who button[aria-pressed=true] .tick{border-color:var(--marigold)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:500;cursor:pointer;font-size:15px}
.pills button[aria-pressed=true]{border-color:var(--indigo);background:var(--indigo);color:#fff}

/* forms */
label.f{display:grid;gap:5px;font-size:14.5px;color:var(--muted);font-weight:500}
.in{border:1.5px solid var(--line);border-radius:13px;padding:11px 13px;background:var(--card);color:var(--text);width:100%;font-size:16px}
.in:focus{border-color:var(--indigo);outline:0}
textarea.in{min-height:96px;resize:vertical}
.phone{display:grid;grid-template-columns:auto minmax(0,1fr);border:1.5px solid var(--line);border-radius:13px;background:var(--card);overflow:hidden}
.phone span{padding:11px 12px;background:var(--well);font-weight:600}
.phone input{border:0;padding:11px 13px;background:transparent;font-size:17px;letter-spacing:.04em;width:100%}
.phone input:focus{outline:0}
.code{font-size:26px;letter-spacing:.5em;text-align:center;font-weight:600;padding:10px}

.toggle{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.toggle:last-of-type{border-bottom:0}
.toggle b{font-weight:600}
.toggle small{color:var(--muted);font-size:14px;grid-column:1}
.switch{width:50px;height:30px;border-radius:999px;background:var(--line);border:0;position:relative;cursor:pointer;grid-row:1/3;grid-column:2}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch[aria-checked=true]{background:var(--good)}
.switch[aria-checked=true]::after{left:23px}
.switch:disabled{opacity:.55}

.bars{display:grid;gap:9px}
.bars .u{display:grid;grid-template-columns:8.5em minmax(0,1fr) 4.6em;gap:10px;align-items:center;font-size:14.5px}
.bars .u span:last-child{text-align:right}
.bars .u span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .b{height:8px;border-radius:4px;background:var(--well);overflow:hidden}
.bars .b i{display:block;height:100%;background:var(--indigo);border-radius:4px}
:root[data-theme="dark"] .bars .b i{background:var(--marigold)}

.thread{display:grid;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.thread:last-child{border-bottom:0}
.msg{background:var(--well);border-radius:4px 14px 14px 14px;padding:8px 11px;font-size:15px;max-width:92%}
.msg.us{background:var(--good-soft);justify-self:end;border-radius:14px 4px 14px 14px}
.msg small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.status{font-size:12.5px;font-weight:600;border-radius:6px;padding:1px 7px;background:var(--well);color:var(--muted)}
.status.open{background:var(--watch-soft);color:var(--watch)} .status.resolved,.status.closed{background:var(--good-soft);color:var(--good)}

.speed{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.speed div{border-left:3px solid var(--indigo);padding:2px 0 2px 10px}
:root[data-theme="dark"] .speed div{border-left-color:var(--marigold)}
.speed b{display:block;font-size:24px;font-weight:700;line-height:1.1}
.speed span{font-size:13px;color:var(--muted)}

.avatar{width:52px;height:52px;border-radius:50%;background:var(--marigold);color:var(--marigold-ink);display:grid;place-items:center;font-weight:700;font-size:20px;flex:none}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px));z-index:6}
.tabs-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs a{display:grid;justify-items:center;gap:1px;padding:7px 2px 5px;color:var(--faint);text-decoration:none;font-size:12.5px;font-weight:500;position:relative}
.tabs a[aria-current=page]{color:var(--text);font-weight:600}
.tabs a[aria-current=page]::before{content:"";position:absolute;top:-4px;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--marigold)}

/* sheet, toast */
.sheet{position:fixed;inset:0;background:rgba(10,14,34,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--card);border-radius:22px 22px 0 0;width:100%;max-width:480px;max-height:90vh;overflow:auto;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);justify-self:center}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--paper);padding:11px 16px;border-radius:14px;z-index:30;max-width:calc(100% - 32px);font-size:15px}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--well);border-top-color:var(--indigo);animation:sp 1s linear infinite;display:inline-block;vertical-align:-4px}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{color:var(--muted);font-size:15px;padding:6px 0}

/* sign-in */
.signin{min-height:100vh;display:grid;grid-template-rows:auto 1fr;align-content:start;max-width:480px;margin:0 auto;background:var(--paper)}
.signin .stack{display:grid;align-content:start}
.signin header{background:var(--indigo);color:#fff;padding:48px 24px 30px;display:grid;gap:14px;border-radius:0 0 28px 28px}
.signin header h1{font-size:30px}
.signin header p{color:var(--indigo-soft)}
.signin form,.signin .body{padding:24px;display:grid;gap:14px;align-content:start}
.labnote{background:var(--marigold-soft);border-radius:14px;padding:12px 14px;font-size:14.5px;display:grid;gap:8px}
@media (max-width:370px){.quick{gap:4px}.quick .ic{width:48px;height:48px}.legend{grid-template-columns:1fr}}
</style>
</head>

   to the subscriber's own router and are not stored by the controller. */
const S = {view: "home", home: null, live: null, brand: {}, picked: null, goal: "low_latency", dur: 3600, timers: [], lang: "en", usage: null};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

/* ------------------------------------------------------------------ words (English / हिन्दी) */
const STR = {

    a_ok: "Working", a_wait: "Waiting for traffic", a_deg: "Not quite keeping up", a_inf: "Your line is too busy for this",
    plan_month: "a month", renews: "Renews {date}", since: "Customer since {date}", unlimited: "Unlimited data", used30: "{gb} used in 30 days", change_plan: "Change plan",
    upload_down: "{d} Mbps down, {u} Mbps up",
    speed: "Speed test", speed_sub: "Measured from your router, so Wi-Fi doesn't change the result.", run: "Run test", run_again: "Test again", testing: "Testing your line", testing_sub: "About 10 seconds. Your router downloads from our test server.",
    sp_down: "Mbps download", sp_delay: "ms extra delay when busy", sp_plan: "Mbps plan",
    sp_ok: "Your line delivers your plan.", sp_low: "Below your plan right now. If it keeps happening, tell us in Help.", sp_home: "Your devices were using {m} Mbps of it during the test.",
    out_area: "Outage in your area", issue_area: "Network issue in your area", out_body: "We know about it and engineers are working on it. You don't need to restart your router.",

    const rest = all.filter(d => !busy.includes(d)).sort((a, b) => (a.name || a.ip).localeCompare(b.name || b.ip));
    $("dl").innerHTML = (busy.length ? `<div class="group"><h3>${t("now_online")}</h3>${busy.map(devRow).join("")}</div>` : "")
      + (rest.length ? `<div class="group"><h3>${t("idle_g")}</h3>${rest.map(devRow).join("")}</div>` : "") || `<p class="empty">${t("none_dev")}</p>`;
    document.querySelectorAll("[data-dev]").forEach(b => b.onclick = () => deviceSheet(b.dataset.dev));
  };
  await draw();
  S.timers.push(setInterval(draw, 6000));
};

    const rows = Object.entries(u.devices).map(([ip, v]) => [names[ip] || ip, v.up_bytes + v.down_bytes]).sort((a, b) => b[1] - a[1]);
    const mx = rows[0]?.[1] || 1;
    $("us").innerHTML = rows.length ? rows.map(([n, b]) => `<div class="u"><span>${esc(n)}</span><span class="b"><i style="width:${(b / mx * 100).toFixed(1)}%"></i></span><span>${gb(b)}</span></div>`).join("") + `<p class="faint">${t("no_cap", {gb: gb(u.total.up_bytes + u.total.down_bytes)})}</p>` : `<p class="empty">${t("no_usage")}</p>`;
  } catch (e) { $("us").innerHTML = `<p class="empty">${esc(e.message)}</p>`; }
};

/* ------------------------------------------------------------------ messages */
async function openNotifs() {
  const ns = await api("GET", "/v1/app/notifications");
  sheet(`<h2>${t("messages")}</h2><div>${ns.map(n => `<div class="thread"><b>${esc(n.title)}</b><span class="muted">${esc(n.body)}</span>
    ${n.kind === "consent" && !n.read ? `<div class="panel-head"><button class="btn sm accent" type="button" data-allow="1">${t("allow60")}</button><button class="btn sm quiet" type="button" data-allow="0">${t("not_now")}</button></div>` : ""}<span class="faint">${ago(n.t)}</span></div>`).join("") || `<p class="empty">${t("no_msgs")}</p>`}</div>`, () => {
    document.querySelectorAll("[data-allow]").forEach(b => b.onclick = async () => {
      await api("POST", "/v1/app/diagnostics/consent", {allow: b.dataset.allow === "1"});
      await api("POST", "/v1/app/notifications"); toast(b.dataset.allow === "1" ? t("allow_ok") : t("allow_no")); closeSheet(); refreshHome();
    });
  });
  if (!ns.some(n => n.kind === "consent" && !n.read)) { await api("POST", "/v1/app/notifications"); refreshHome().catch(() => {}); }
}

/* ------------------------------------------------------------------ sign-in */
function renderLogin() {
  S.timers.forEach(clearInterval); S.timers = [];
  document.documentElement.lang = S.lang;
  $("root").innerHTML = `<div class="signin"><header>${MARK.replace('width="30" height="30"', 'width="54" height="54"')}<div><h1>${esc(S.brand.name || "SampleNet Fibre")}</h1><p>${t("si_sub")}</p></div></header>
    <div class="stack"><div class="body" id="quickbox" hidden style="padding-bottom:0"><div class="labnote"><span>${t("lab_note")}</span><button class="btn accent" id="quick" type="button">${t("lab_home")}</button></div></div>
    <form id="lf"><label class="f" for="lp">${t("mobile")}<span class="phone"><span>+91</span><input id="lp" inputmode="numeric" autocomplete="tel-national" placeholder="98000 00001" maxlength="11" required></span></label>
      <div id="otp" hidden style="display:grid;gap:12px"><label class="f" for="lc">${t("code6")}<input class="in code" id="lc" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></label><div id="demo"></div></div>
      <p id="lm" style="color:var(--bad);margin:0;font-size:15px" role="alert"></p><button class="btn" type="submit" id="lb">${t("send_code")}</button>
      <button class="lang" type="button" id="lang0" style="color:var(--text);border-color:var(--line);justify-self:start">${S.lang === "hi" ? "English" : "हिन्दी"}</button></form></div></div>`;
  $("lang0").onclick = () => { S.lang = S.lang === "hi" ? "en" : "hi"; try { localStorage.setItem("iqa-lang", S.lang); } catch (e) {} renderLogin(); };
  fetch("/v1/auth/quick-roles").then((r) => r.json()).then((q) => {
    if (!q.enabled) return;
    $("quickbox").hidden = false;
    $("quick").onclick = async () => { try { await api("POST", "/v1/app/quick", {}); start(); } catch (err) { $("lm").textContent = err.message; } };
  }).catch(() => {});
  let sent = false;
  $("lf").onsubmit = async (e) => {
    e.preventDefault(); $("lm").textContent = "";
    try {
      if (!sent) {
        const r = await api("POST", "/v1/app/otp", {phone: $("lp").value});
        sent = true; $("otp").hidden = false; $("lb").textContent = t("verify"); $("lc").focus();
        if (r.demo_code) $("demo").innerHTML = `<div class="labnote">${t("demo_code", {code: `<b>${esc(r.demo_code)}</b>`})}</div>`;
      } else {
        await api("POST", "/v1/app/login", {phone: $("lp").value, code: $("lc").value}); start();
      }
    } catch (err) { $("lm").textContent = err.message; }
  };
}
async function start() {
  try { const th = localStorage.getItem("iqa-theme"); if (th && th !== "auto") document.documentElement.dataset.theme = th; } catch (e) {}
  try { const lg = localStorage.getItem("iqa-lang"); if (lg) S.lang = lg; } catch (e) {}
  try { S.brand = await api("GET", "/v1/app/brand"); document.title = S.brand.short || "SampleNet"; } catch (e) {}
  try { await refreshHome(); } catch (e) { if (e.message === "signed out") return; }
  renderShell(); route();
}
start();
</script>

// installable app: the service worker needs a secure origin (https, or the phone app's own wrapper)
if ("serviceWorker" in navigator && window.isSecureContext) navigator.serviceWorker.register("/app/sw.js", {scope: "/app/"}).catch(() => {});
</script>
