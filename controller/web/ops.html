<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IntentQoS Fleet</title>
<style>
/* IntentQoS Fleet: the ISP's internal console for network operations and the support desk.
   An enterprise tool, not a showcase: light, dense, bordered, IBM Plex for text with Plex Mono for
   identifiers people copy (serials, OLTs, versions). The memorable element is the access-network
   strip on the overview: every home is one square, grouped by OLT and coloured by its grade, so an
   area problem shows up as a block of colour rather than as many separate alerts. */
@font-face{font-family:"Plex";src:url(/fonts/plex-sans-var.woff) format("woff");font-weight:100 700;font-stretch:85% 100%;font-display:swap}
@font-face{font-family:"Plex Mono";src:url(/fonts/plex-mono-400.woff) format("woff");font-weight:400;font-display:swap}
@font-face{font-family:"Plex Mono";src:url(/fonts/plex-mono-500.woff) format("woff");font-weight:500;font-display:swap}
:root{
  --canvas:#F3F4F6; --surface:#FFFFFF; --sunken:#ECEEF2; --hover:#F6F7F9; --border:#D8DCE3; --border-2:#C4CAD4;
  --text:#1B2130; --text-2:#576173; --text-3:#8790A0;
  --act:#2459C4; --act-soft:#E7EEFB; --act-ink:#FFFFFF;
  --crit:#C0321D; --crit-soft:#FCE9E5; --major:#C25A0C; --major-soft:#FDEFE2; --minor:#9E7A0B; --minor-soft:#FAF3D8; --ok:#1C7C52; --ok-soft:#E1F3EA; --info-soft:#E7EEFB;
  /* grades: a sequential scale from calm to alarming */
  --gAp:#1C7C52; --gA:#4FA272; --gB:#C9A227; --gC:#E07B26; --gD:#CF4A2B; --gF:#9B1C1C; --gN:#C8CDD6;
  /* traffic classes (shared with the gateway console) */
  --intent:#8E7CEB; --voice:#2CA57A; --video:#4C86E6; --besteffort:#D69A2D; --bulk:#D9628A;
  --brand:#1D2B5E; --lab:#F2A93B;
  --sans:"Plex",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --canvas:#12151B; --surface:#1A1E26; --sunken:#151820; --hover:#212631; --border:#2C323E; --border-2:#3A4250;
    --text:#E4E7EE; --text-2:#A3ABBA; --text-3:#7A8394; --act:#6E9BF0; --act-soft:#1C2A45; --act-ink:#0E1420;
    --crit:#F07A62; --crit-soft:#3A1C17; --major:#F0A060; --major-soft:#3A2614; --minor:#DCBE5A; --minor-soft:#332B12; --ok:#58C493; --ok-soft:#14301F; --info-soft:#1C2A45;
    --gN:#3A4250; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --canvas:#12151B; --surface:#1A1E26; --sunken:#151820; --hover:#212631; --border:#2C323E; --border-2:#3A4250;
  --text:#E4E7EE; --text-2:#A3ABBA; --text-3:#7A8394; --act:#6E9BF0; --act-soft:#1C2A45; --act-ink:#0E1420;
  --crit:#F07A62; --crit-soft:#3A1C17; --major:#F0A060; --major-soft:#3A2614; --minor:#DCBE5A; --minor-soft:#332B12; --ok:#58C493; --ok-soft:#14301F; --info-soft:#1C2A45;
  --gN:#3A4250; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--canvas);color:var(--text);font-family:var(--sans);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--act);outline-offset:1px}
[hidden]{display:none!important}
h1,h2,h3{margin:0;font-weight:600}
a{color:var(--act);text-decoration:none}
a:hover{text-decoration:underline}
code,.id{font-family:var(--mono);font-size:12.5px}
code{background:var(--sunken);border-radius:3px;padding:0 4px;overflow-wrap:anywhere}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* frame: app bar on top, nav on the left */
.app{display:grid;grid-template-rows:48px minmax(0,1fr);grid-template-columns:208px minmax(0,1fr);min-height:100%;background:linear-gradient(to right,var(--surface) 207px,var(--border) 207px,var(--border) 208px,var(--canvas) 208px)}
.appbar{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 14px 0 16px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.prod{display:flex;align-items:center;gap:9px;min-width:192px;color:var(--text);text-decoration:none}
.prod:hover{text-decoration:none}
.prod b{font-size:15px;font-weight:600;letter-spacing:-.005em}
.prod span{color:var(--text-3);font-size:13px}
.search{flex:1;max-width:560px;position:relative}
.search input{width:100%;height:32px;border:1px solid var(--border);border-radius:6px;background:var(--sunken);padding:0 34px 0 32px}
.search input:focus{background:var(--surface);border-color:var(--act);outline:0}
.search svg{position:absolute;left:9px;top:8px;color:var(--text-3)}
.search kbd{position:absolute;right:8px;top:6px;font-family:var(--mono);font-size:11px;border:1px solid var(--border-2);border-radius:4px;padding:0 5px;color:var(--text-3);background:var(--surface)}
.appbar .sp{flex:1}
.env{font-size:12px;font-weight:600;border-radius:4px;padding:2px 8px;background:var(--lab);color:#3A2500}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-2)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.me{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:6px;padding:3px 8px 3px 4px;background:var(--surface);cursor:pointer}
.me .av{width:24px;height:24px;border-radius:4px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:11.5px;font-weight:600}
.me small{color:var(--text-3)}
.menu{position:absolute;right:14px;top:44px;background:var(--surface);border:1px solid var(--border);border-radius:6px;min-width:200px;padding:4px;display:grid;box-shadow:0 8px 24px rgba(20,25,40,.14)}
.menu button{background:none;border:0;text-align:left;padding:7px 10px;border-radius:4px;cursor:pointer}
.menu button:hover{background:var(--hover)}
.menu .hd{padding:8px 10px;color:var(--text-2);font-size:12.5px;border-bottom:1px solid var(--border);margin-bottom:4px}

.nav{background:var(--surface);border-right:1px solid var(--border);padding:10px 8px;align-self:start;position:sticky;top:48px;height:calc(100vh - 48px);overflow:auto;display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:5px;color:var(--text-2);font-weight:500}
.nav a:hover{background:var(--hover);color:var(--text);text-decoration:none}
.nav a svg{flex:none;color:var(--text-3)}
.nav a[aria-current=page]{background:var(--act-soft);color:var(--act)}
.nav a[aria-current=page] svg{color:var(--act)}
.nav a .cnt{margin-left:auto;font-size:11.5px;font-weight:600;border-radius:9px;padding:0 6px;background:var(--crit-soft);color:var(--crit)}
.nav hr{border:0;border-top:1px solid var(--border);margin:8px 6px}
.nav .foot{margin-top:auto;color:var(--text-3);font-size:12px;padding:8px 9px 2px;line-height:1.5}

.main{min-width:0;display:flex;flex-direction:column}
.pagehead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:16px 24px 12px}
.pagehead h1{font-size:20px;letter-spacing:-.01em}
.pagehead .ctx{color:var(--text-2);font-size:13px;width:100%;margin-top:2px}
.pagehead .sp{flex:1}
.crumb{color:var(--text-3);font-size:12.5px;width:100%;margin-bottom:2px}
.crumb a{color:var(--text-2)}
.content{padding:0 24px 48px;display:grid;gap:16px;max-width:1500px;width:100%}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:14px 16px;min-width:0}
.panel>h2,.ph h2{font-size:14.5px;font-weight:600}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.ph .sp{flex:1}
.sub{color:var(--text-2);font-size:12.5px;margin:2px 0 10px}
.cols{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr))}
.cols.wl{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
.cols.wr{grid-template-columns:minmax(0,1fr) minmax(0,1.65fr)}
.hstack{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.hstack .sp{flex:1}

/* controls */
.btn{height:30px;border:1px solid var(--border-2);background:var(--surface);border-radius:5px;padding:0 12px;font-weight:500;cursor:pointer;font-size:13px;white-space:nowrap;text-decoration:none;color:var(--text);display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--hover);text-decoration:none}
.btn.primary{background:var(--act);border-color:var(--act);color:#fff}
:root[data-theme="dark"] .btn.primary{color:var(--act-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,var(--border-2))}
.btn.quiet{border-color:transparent;background:transparent;color:var(--act)}
.btn.quiet:hover{background:var(--act-soft)}
.btn.small{height:26px;padding:0 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--border-2);border-radius:5px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:0 10px;height:28px;cursor:pointer;font-size:12.5px;color:var(--text-2);border-right:1px solid var(--border)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--act-soft);color:var(--act);font-weight:600}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--text-2);font-weight:500}
input.t,select.t,textarea.t{border:1px solid var(--border-2);border-radius:5px;padding:5px 8px;background:var(--surface);color:var(--text);width:100%;min-height:30px}
input.t:focus,select.t:focus,textarea.t:focus{border-color:var(--act);outline:0;box-shadow:0 0 0 3px var(--act-soft)}
textarea.t{min-height:70px;resize:vertical}
.form{display:grid;gap:10px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}

/* status */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:4px;padding:1px 7px;font-size:12px;font-weight:500;background:var(--sunken);color:var(--text-2);white-space:nowrap;line-height:1.5}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--minor-soft);color:var(--minor)} .pill.alert{background:var(--crit-soft);color:var(--crit)} .pill.info{background:var(--info-soft);color:var(--act)} .pill.major{background:var(--major-soft);color:var(--major)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.tag{display:inline-block;font-size:11px;font-weight:500;padding:0 5px;border-radius:3px;border:1px solid var(--border-2);color:var(--text-3);vertical-align:1px}
.tag.real{border-color:color-mix(in srgb,var(--ok) 50%,transparent);color:var(--ok)}
.g{display:inline-grid;place-items:center;min-width:28px;height:20px;border-radius:4px;font-weight:600;font-size:12px;color:#fff;background:var(--c);padding:0 5px}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--border);border-radius:6px;background:var(--surface)}
.kpi{padding:10px 14px;border-right:1px solid var(--border);min-width:0}
.kpi:last-child{border-right:0}
.kpi .l{font-size:12px;color:var(--text-2)}
.kpi .v{font-size:24px;font-weight:600;line-height:1.2;margin-top:2px;letter-spacing:-.01em}
.kpi .v small{font-size:13px;color:var(--text-3);font-weight:500;margin-left:2px}
.kpi .d{font-size:12px;color:var(--text-3)}
.kpi.bad .v{color:var(--crit)}

.gradebar{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--sunken);gap:1px}
.gradebar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:12px;color:var(--text-2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c);vertical-align:-1px;margin-right:4px}

/* access-network strip (signature) */
.strip{display:grid;gap:2px}
.olt-row{display:grid;grid-template-columns:200px minmax(0,1fr) 110px;gap:12px;align-items:center;padding:5px 6px;border-radius:5px}
.olt-row:hover{background:var(--hover)}
.olt-row.hot{background:var(--crit-soft)}
.olt-name{display:grid;line-height:1.3;background:none;border:0;text-align:left;cursor:pointer;padding:0}
.olt-name b{font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--text)}
.olt-name span{font-size:11.5px;color:var(--text-3)}
.cells{display:flex;flex-wrap:wrap;gap:2px}
.cell{width:13px;height:13px;border-radius:2px;background:var(--c,var(--gN));border:0;padding:0;cursor:pointer}
.cell.al{box-shadow:inset 0 0 0 2px var(--surface),0 0 0 1px var(--crit)}
.cell.off{background:repeating-linear-gradient(45deg,var(--gN) 0 2px,transparent 2px 4px);border:1px solid var(--border-2)}
.cell.real{outline:2px solid var(--text);outline-offset:1px}
.olt-stat{font-size:12px;color:var(--text-2);text-align:right}
.olt-stat b{color:var(--text)}
.olt-row.hot .olt-stat b{color:var(--crit)}
.region{font-size:12px;font-weight:600;color:var(--text-2);padding:8px 6px 2px;border-top:1px solid var(--border);margin-top:4px}
.region:first-child{border-top:0;margin-top:0;padding-top:0}

/* tables */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--text-2);background:var(--sunken);border-bottom:1px solid var(--border);padding:6px 8px;white-space:nowrap;font-size:12px}
td{border-bottom:1px solid var(--border);padding:6px 8px;vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--hover)}
.kv td:first-child{color:var(--text-2);width:34%;white-space:nowrap}
.empty{color:var(--text-2);padding:10px 0}
.muted{color:var(--text-3)}

/* incidents, diagnosis */
.inc{border:1px solid var(--border);border-left:3px solid var(--c,var(--crit));border-radius:6px;padding:12px 14px;display:grid;gap:6px;background:var(--surface)}
.inc h3{font-size:15px}
.inc .meta{font-size:12px;color:var(--text-2)}
.diag{border-radius:6px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--c-line,var(--act));display:grid;gap:8px}
.diag b.verdict{font-size:16px;line-height:1.35;font-weight:600}
.diag ul{margin:0;padding-left:18px;font-size:13px}
.where{font-size:12px;font-weight:600;color:var(--c-line,var(--act))}

.timeline{list-style:none;margin:0;padding:0}
.timeline li.empty{display:block}
.timeline li{display:grid;grid-template-columns:52px 96px minmax(0,1fr);gap:10px;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px}
.timeline li:last-child{border-bottom:0}
.timeline time{font-family:var(--mono);font-size:12px;color:var(--text-3)}
.timeline .k{font-size:12px;color:var(--text-2);font-weight:500}
.warn-t{color:var(--minor)} .error-t{color:var(--crit)}
canvas{width:100%;display:block}
.chart{height:200px}
pre.mono{font-family:var(--mono);font-size:12px;background:var(--sunken);border-radius:5px;padding:10px;overflow:auto;max-height:320px;margin:0;white-space:pre-wrap}
.stages{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.stage{border:1px solid var(--border-2);border-radius:4px;padding:2px 8px;font-size:12.5px;font-weight:500;color:var(--text-2)}
.stage.done{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.stage.cur{border-color:var(--act);color:var(--act);background:var(--act-soft)}
.cmpt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--border);border-radius:6px;margin:10px 0}
.cmpt div{padding:8px 12px;border-right:1px solid var(--border)}
.cmpt div:last-child{border-right:0}
.cmpt .v{font-size:20px;font-weight:600}
.cmpt .l{font-size:12px;color:var(--text-2)}

/* identity strip on the home view */
.who-strip{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.who-strip .av{width:40px;height:40px;border-radius:6px;background:var(--sunken);display:grid;place-items:center;font-weight:600;color:var(--text-2)}
.who-strip h2{font-size:17px}
.facts{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--text-2);font-size:12.5px}
.facts b{color:var(--text);font-weight:500}

/* sign-in */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,440px);background:var(--surface)}
.login .art{background:var(--brand);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login .art h1{font-size:30px;line-height:1.15;max-width:15em;font-weight:600}
.login .art p{color:#C9D0EC;max-width:34em}
.login .art svg.bg{position:absolute;right:-60px;bottom:-40px;opacity:.5}
.login .side{padding:48px 40px;display:grid;align-content:center;gap:14px}
.login .side h2{font-size:20px}
.role{display:grid;grid-template-columns:36px minmax(0,1fr);gap:2px 12px;align-items:center;text-align:left;border:1px solid var(--border-2);background:var(--surface);border-radius:6px;padding:10px 12px;cursor:pointer}
.role:hover{border-color:var(--act);background:var(--act-soft)}
.role .av{grid-row:1/3;width:36px;height:36px;border-radius:5px;background:var(--sunken);display:grid;place-items:center;font-weight:600;color:var(--text-2)}
.role b{font-weight:600}
.role span{font-size:12.5px;color:var(--text-2)}
.labnote{font-size:12.5px;color:var(--text-2);border-left:3px solid var(--lab);padding:4px 0 4px 10px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--surface);padding:9px 14px;border-radius:6px;z-index:60;max-width:min(560px,calc(100% - 32px))}
.scrim{position:fixed;inset:0;background:rgba(15,20,32,.45);display:grid;place-items:center;z-index:50;padding:16px}
.dialog{background:var(--surface);border-radius:8px;padding:18px;max-width:460px;width:100%;display:grid;gap:10px;border:1px solid var(--border)}
.dialog h3{font-size:16px}
@media (max-width:1200px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kpi:nth-child(3n){border-right:0}.kpi:nth-child(-n+3){border-bottom:1px solid var(--border)}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr)}
  .appbar{flex-wrap:wrap;padding:8px 12px;height:auto}
  .prod{min-width:0}
  .search{order:5;flex-basis:100%;max-width:none}
  .nav{position:static;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--border);padding:6px}
  .nav hr,.nav .foot{display:none}
  .nav a{white-space:nowrap}
  .pagehead,.content{padding-left:14px;padding-right:14px}
  .cols,.cols.wl,.cols.wr{grid-template-columns:minmax(0,1fr)}
  .olt-row{grid-template-columns:minmax(0,1fr) auto}
  .olt-row .cells{grid-column:1/-1;order:3}
  .login{grid-template-columns:minmax(0,1fr)}
  .login .art{padding:28px}
  .login .side{padding:24px}
}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi{border-right:0!important;border-bottom:1px solid var(--border)}.cmpt{grid-template-columns:minmax(0,1fr)}.timeline li{grid-template-columns:48px minmax(0,1fr)}.timeline .k{display:none}.me small,.prod span{display:none}}
</style>
</head>
<body>
<div id="root"></div>
<div id="overlay"></div>
<script>
"use strict";
/* IntentQoS fleet console: the operator side of the product. Talks to the controller's /v1 API. */
const S = {me: null, perms: new Set(), view: "overview", arg: null, data: {}, timer: null, homeQ: "", homeF: "", brand: {}};
const GR = ["A+", "A", "B", "C", "D", "F"];
const GCOL = {"A+": "--gAp", "A": "--gA", "B": "--gB", "C": "--gC", "D": "--gD", "F": "--gF"};
const SEV = {major: "alert", minor: "warn", info: "info"};
const RULE_NAME = {qoe_poor: "High delay under load", capacity_shortfall: "Line short of plan", blind: "Reflectors not answering",
  engine_down: "Engine down", watchdog_trip: "Watchdog trip", apply_failures: "Shaper apply failed", drift: "Classifier drift",

/* ------------------------------------------------------------------ charts */
function lineChart(cv, series, o) {
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight; if (!W) return;
  cv.width = W * dpr; cv.height = H * dpr; const x = cv.getContext("2d"); x.setTransform(dpr, 0, 0, dpr, 0, 0);
  const L = 40, R = 40, T = 12, B = 22, t0 = o.t0, t1 = o.t1;
  const X = t => L + (t - t0) / (t1 - t0) * (W - L - R);
  x.font = `11px ${css("--sans")}`;
  const axes = {};
  for (const s of series) {
    const ax = s.axis || "l", v = s.pts.map(p => p[1]).filter(Number.isFinite);
    axes[ax] = Math.max(axes[ax] || (s.min || 1), ...v, s.min || 1);
  }
  for (const k in axes) { const m = axes[k] * 1.1, p = Math.pow(10, Math.floor(Math.log10(m))); axes[k] = Math.ceil(m / p) * p; }
  const Y = (v, ax) => T + (1 - Math.max(0, v) / axes[ax || "l"]) * (H - T - B);
  for (let i = 0; i <= 4; i++) {
    const y = T + i / 4 * (H - T - B) + .5; x.strokeStyle = css("--border"); x.beginPath(); x.moveTo(L, y); x.lineTo(W - R, y); x.stroke();
    x.fillStyle = css("--text-2"); x.textAlign = "right"; if (axes.l) x.fillText(+(axes.l * (1 - i / 4)).toFixed(1), L - 5, y + 4);
    x.textAlign = "left"; if (axes.r) x.fillText(+(axes.r * (1 - i / 4)).toFixed(1), W - R + 5, y + 4);
  }
  x.textAlign = "center"; x.fillStyle = css("--text-2");
  for (let i = 0; i <= 4; i++) { const t = t0 + (t1 - t0) * i / 4; x.fillText(clock(t), X(t), H - 6); }
  for (const b of (o.bands || [])) { x.fillStyle = css("--crit"); x.globalAlpha = .08; x.fillRect(X(Math.max(t0, b[0])), T, X(Math.min(t1, b[1])) - X(Math.max(t0, b[0])), H - T - B); x.globalAlpha = 1; }
  for (const s of series) {
    const pts = s.pts.filter(p => Number.isFinite(p[1]) && p[0] >= t0 && !(s.skipZero && p[1] <= 0)); if (!pts.length) continue;
    // Break the line where reports are missing (gateway offline, engine restarting) instead of drawing across the gap.
    const dts = pts.slice(1).map((p, i) => p[0] - pts[i][0]).sort((a, b) => a - b);
    const gap = Math.max(o.gap || 90, 3 * (dts[dts.length >> 1] || 0));
    const segs = [[pts[0]]];
    for (let i = 1; i < pts.length; i++) { if (pts[i][0] - pts[i - 1][0] > gap) segs.push([]); segs[segs.length - 1].push(pts[i]); }
    for (const sg of segs) {
      if (s.fill && sg.length > 1) { x.beginPath(); x.moveTo(X(sg[0][0]), Y(0, s.axis)); sg.forEach(([t, v]) => x.lineTo(X(t), Y(v, s.axis))); x.lineTo(X(sg[sg.length - 1][0]), Y(0, s.axis)); x.fillStyle = s.color; x.globalAlpha = .14; x.fill(); x.globalAlpha = 1; }
      x.strokeStyle = s.color; x.lineWidth = s.width || 1.8; if (s.dash) x.setLineDash(s.dash); x.beginPath();
      sg.forEach(([t, v], i) => i ? x.lineTo(X(t), Y(v, s.axis)) : x.moveTo(X(t), Y(v, s.axis))); x.stroke(); x.setLineDash([]);
    }
    const [lt, lv] = pts[pts.length - 1]; x.fillStyle = s.color; x.beginPath(); x.arc(X(lt), Y(lv, s.axis), 2.6, 0, 7); x.fill();
  }
}

const CMD_NAME = {relay: "console request", line_test: "line test", install_model: "install model", rollback_model: "roll back model",
  apply_config: "apply config", set_level: "telemetry level", snapshot: "status snapshot"};
function groupCmds(cs) {            // consecutive console requests by the same person collapse into one row
  const out = [];
  for (const c of cs) {
    const p = out[out.length - 1];
    if (p && p.kind === c.kind && p.requested_by === c.requested_by && p.status === c.status && c.kind === "relay" && Math.abs(p.created - c.created) < 600) p.n++;
    else out.push({...c, n: 1});
  }
  return out;
}

  const rcard = (r) => { const ev = r.eval || {}; return `<div class="panel"><div class="hstack"><h2>${esc(r.name)}</h2><span class="pill ${r.status === "running" ? "info" : r.status === "completed" ? "ok" : "alert"}">${esc(r.status)}</span><span class="sp"></span><span class="sub" style="margin:0">${esc(r.kind)} → <code>${esc(r.target)}</code> · by ${esc(r.created_by)} ${ago(r.created)}</span></div>
    <div class="stages" style="margin:10px 0">${r.stages.map((s, i) => `<span class="stage ${i < r.stage || r.status === "completed" ? "done" : i === r.stage ? "cur" : ""}">${s.pct}% · ≥${s.min_minutes} min</span>`).join("→")}</div>
    ${r.eval ? `<div class="cmpt"><div><div class="v num">${ev.canary_p95 != null ? ev.canary_p95.toFixed(1) : "–"} ms</div><div class="l">updated homes (${ev.canary_n}): median delay added p95</div></div><div><div class="v num">${ev.control_p95 != null ? ev.control_p95.toFixed(1) : "–"} ms</div><div class="l">other homes (${ev.control_n})</div></div><div><div class="v num">${ev.p != null ? (ev.p < .001 ? "<0.001" : ev.p.toFixed(3)) : "–"}</div><div class="l">p-value (Mann-Whitney) · ${ev.acked}/${ev.members} applied, ${ev.fail} failed</div></div></div>
      <p class="sub">Guardrail: halt and roll back if updated homes are worse by more than ${r.guardrails.max_p95_increase_ms} ms and ${r.guardrails.max_p95_increase_rel * 100}% with p &lt; ${r.guardrails.p_value}, or if more than ${r.guardrails.max_failure_rate * 100}% fail to apply.</p>` : ""}
    <ul class="timeline">${r.decisions.slice().reverse().map(x => `<li><time>${clock(x.t)}</time><span class="k">${esc(x.action)}</span><span>${x.why ? esc(x.why.join("; ")) : x.eval ? `stage ${x.stage + 1}: ${x.eval.canary_n} updated vs ${x.eval.control_n} others, ${x.eval.canary_p95?.toFixed?.(1) ?? "–"} vs ${x.eval.control_p95?.toFixed?.(1) ?? "–"} ms` : esc(x.by ? `by ${x.by}` : "")}</span></li>`).join("")}</ul>
    ${can("rollouts") && ["running", "paused", "halted"].includes(r.status) ? `<div class="hstack" style="margin-top:10px">${r.status === "running" ? `<button class="btn small" data-ro="halt" data-id="${r.id}">Pause</button><button class="btn small" data-ro="advance" data-id="${r.id}">Advance now</button>` : `<button class="btn small" data-ro="resume" data-id="${r.id}">Resume</button>`}<button class="btn small danger" data-ro="rollback" data-id="${r.id}">Roll back</button></div>` : ""}</div>`; };
  $("content").innerHTML = `${cur ? rcard(cur) : ""}
  <section class="cols">
    <div class="panel"><h2>Classifier models</h2><p class="sub">Each model file is signed with the operator release key; routers refuse anything else.</p>
      <table><thead><tr><th>Release</th><th>Note</th><th class="n">Homes</th><th class="n">Accuracy</th></tr></thead><tbody>${models.map(m => `<tr><td><code>${esc(m.version)}</code></td><td>${esc(m.note)}</td><td class="n">${m.homes}</td><td class="n">${(m.metrics.tin_accuracy_hybrid * 100).toFixed(1)}%</td></tr>`).join("")}</tbody></table></div>
    <div class="panel"><h2>Config profiles</h2><p class="sub">Only allow-listed keys can be managed remotely; plan rates come from billing.</p>
      <table><thead><tr><th>Profile</th><th>Settings</th><th class="n">Homes</th></tr></thead><tbody>${pr.profiles.map(p => `<tr><td><b>${esc(p.name)}</b> v${p.version}<br><span class="sub" style="margin:0">${esc(p.description)}</span></td><td><code>${esc(Object.entries(p.settings).map(([k, v]) => `${k}=${v}`).join(" "))}</code></td><td class="n">${p.homes}</td></tr>`).join("")}</tbody></table></div>
  </section>
  ${can("rollouts") ? `<section class="panel"><h2>Start a rollout</h2><form class="form" id="ro-f"><div class="row">
    <label class="f" for="ro-k">What<select class="t" id="ro-k"><option value="model">Classifier model</option><option value="profile">Config profile</option></select></label>
    <label class="f" for="ro-t">Target<select class="t" id="ro-t"></select></label>
    <label class="f" for="ro-s">Stages<select class="t" id="ro-s"><option value="5,25,100">5% → 25% → 100%</option><option value="10,50,100">10% → 50% → 100%</option><option value="1,10,100">1% → 10% → 100%</option></select></label>
    <label class="f" for="ro-m">Minutes per stage<input class="t" id="ro-m" type="number" min="1" max="1440" value="3"></label></div>
    <div><button class="btn primary" type="submit" ${cur ? "disabled" : ""}>Start rollout</button> ${cur ? '<span class="sub">Finish or roll back the current rollout first.</span>' : ""}</div></form></section>` : ""}
  ${ro.filter(r => r !== cur).length ? `<section class="panel"><h2>Earlier rollouts</h2><table><tbody>${ro.filter(r => r !== cur).map(r => `<tr><td>${esc(r.name)}</td><td>${esc(r.kind)} → <code>${esc(r.target)}</code></td><td><span class="pill ${r.status === "completed" ? "ok" : "warn"}">${esc(r.status)}</span></td><td>${dt(r.created)}</td></tr>`).join("")}</tbody></table></section>` : ""}`;
  document.querySelectorAll("[data-ro]").forEach(b => b.onclick = async () => {
    if (b.dataset.ro === "rollback" && !(await ask("Roll back this rollout?", "Every home that received it goes back to its previous model or profile.", "Roll back", true))) return;
    await api("POST", `/v1/rollouts/${b.dataset.id}/${b.dataset.ro}`); toast("Done."); route();
  });
  if ($("ro-f")) {
    const fill = () => { $("ro-t").innerHTML = $("ro-k").value === "model" ? models.map(m => `<option value="${esc(m.version)}">${esc(m.version)}</option>`).join("") : pr.profiles.map(p => `<option value="${p.id}">${esc(p.name)} v${p.version}</option>`).join(""); };
    $("ro-k").onchange = fill; fill();
    $("ro-f").onsubmit = async (e) => {
      e.preventDefault();
      const mins = +$("ro-m").value, stages = $("ro-s").value.split(",").map(p => ({pct: +p, min_minutes: mins}));
      try { await api("POST", "/v1/rollouts", {kind: $("ro-k").value, target: $("ro-t").value, name: `${$("ro-k").value} ${$("ro-t").selectedOptions[0].text}`, stages}); toast("Rollout started."); route(); }
      catch (err) { toast(err.message); }
    };
  }
}};

PAGES.reports = {title: () => "Reports", async render() {
  $("ctx").textContent = "From 5-minute rollups of every home's telemetry";
  $("content").innerHTML = `<section class="panel"><form class="hstack" id="rp-f"><label class="f" for="rp-by">Group by<select class="t" id="rp-by" style="width:auto"><option value="region">Region</option><option value="pop">PoP</option><option value="olt">OLT</option><option value="plan">Plan</option></select></label>
    <label class="f" for="rp-h">Period<select class="t" id="rp-h" style="width:auto"><option value="1">Last hour</option><option value="6">6 hours</option><option value="24" selected>24 hours</option><option value="168">7 days</option></select></label>
    <span class="sp"></span><a class="btn quiet" id="rp-csv" href="#">Download CSV</a></form>
    <p class="sub" style="margin-top:12px">TRAI's 2024 wireline benchmarks are latency below 50 ms and jitter below 40 ms. The gateway measures the delay it can control (added under load, at the access link), so these columns are a proxy, not the regulator's end-to-end test.</p>
    <div class="tablewrap"><table><thead><tr><th>Group</th><th class="n">Homes</th><th class="n">Samples</th><th class="n">Delay added p95, mean</th><th class="n">Below 50 ms</th><th class="n">Jitter below 40 ms</th><th class="n">Grade C or worse</th><th class="n">Plan used at peak</th></tr></thead><tbody id="rp-b"></tbody></table></div></section>`;
  const load = async () => {
    const by = $("rp-by").value, h = $("rp-h").value;
    $("rp-csv").href = `/v1/reports/qoe?by=${by}&hours=${h}&format=csv`;
    const rows = await api("GET", `/v1/reports/qoe?by=${by}&hours=${h}`);
    $("rp-b").innerHTML = rows.map(r => `<tr><td>${esc(r.grp)}</td><td class="n">${r.homes}</td><td class="n">${r.n}</td><td class="n">${r.p95_mean} ms</td><td class="n">${r.lat_ok_pct}%</td><td class="n">${r.jit_ok_pct}%</td><td class="n">${r.poor_pct}%</td><td class="n">${r.util}%</td></tr>`).join("") || `<tr><td colspan="8" class="empty">Not enough data yet: rollups are written every 5 minutes.</td></tr>`;
  };
  $("rp-by").onchange = load; $("rp-h").onchange = load; await load();
}};

PAGES.admin = {title: () => "Admin", async render() {
  const [sys, audit, priv] = await Promise.all([api("GET", "/v1/admin/system"), api("GET", "/v1/audit?limit=120"), api("GET", "/v1/privacy/requests")]);
  const users = can("users") ? await api("GET", "/v1/admin/users") : [];
  const hooks = can("integrations") ? await api("GET", "/v1/admin/webhooks") : [];
  $("ctx").textContent = "Access, audit, privacy and integrations";
  $("content").innerHTML = `<section class="cols">
    <div class="panel"><h2>Audit log</h2><p class="sub">Who did what, including who looked at which home. Subscribers can see entries about their own data in their app.</p>
      <div style="max-height:420px;overflow:auto"><ul class="timeline">${audit.map(a => `<li><time>${clock(a.t)}</time><span class="k">${esc(a.actor_type)}</span><span><b>${esc(a.actor)}</b> ${esc(a.action.replace(/_/g, " "))} <code>${esc(a.target)}</code></span></li>`).join("")}</ul></div></div>
    <div class="panel"><h2>Privacy requests</h2><p class="sub">DPDP Act 2023: answer within 30 days. Erasure, correction and grievances raised in the consumer app.</p>
      <table><tbody>${priv.map(p => `<tr><td>#${p.id} ${esc(p.kind)}</td><td>${esc(p.account)}</td><td>due ${dt(p.due)}</td><td>${p.status === "open" && can("privacy") ? `<button class="btn small" data-close="${p.id}">Mark done</button>` : `<span class="pill ${p.status === "open" ? "warn" : "ok"}">${esc(p.status)}</span>`}</td></tr>`).join("") || `<tr><td class="empty">No requests.</td></tr>`}</tbody></table>
      <h3 style="font-size:16px;margin:16px 0 6px">Controller</h3>
      <table><tbody><tr><td>Release public key</td><td><code>${esc(sys.release_pubkey)}</code></td></tr><tr><td>Telemetry rows</td><td>${sys.telemetry_rows} (${(sys.db_bytes / 1e6).toFixed(1)} MB)</td></tr>
      <tr><td>Retention</td><td>raw ${sys.retention.raw_hours} h · rollups ${sys.retention.rollup_days} d · events ${sys.retention.events_days} d</td></tr><tr><td>Uptime</td><td>${Math.round(sys.uptime_s / 60)} min</td></tr></tbody></table></div>
  </section>
  ${can("users") ? `<section class="cols"><div class="panel"><h2>Staff</h2><table><thead><tr><th>User</th><th>Name</th><th>Role</th></tr></thead><tbody>${users.map(u => `<tr><td>${esc(u.username)}</td><td>${esc(u.name)}</td><td>${esc(u.role)}</td></tr>`).join("")}</tbody></table>
      <form class="form" id="u-f" style="margin-top:10px"><div class="row"><input class="t" id="u-n" placeholder="username" required aria-label="Username"><select class="t" id="u-r" aria-label="Role"><option>support</option><option>noc</option><option>viewer</option><option>admin</option></select><input class="t" id="u-p" type="password" placeholder="password" required aria-label="Password"></div><div><button class="btn small" type="submit">Add user</button></div></form>
      <p class="sub">Roles: viewer (read), support (home actions, live console read, devices and priorities), noc (all home actions, incidents, notifications), admin (rollouts, models, users, privacy, integrations).</p></div>
    <div class="panel"><h2>Webhooks</h2><p class="sub">Events: alert.opened, incident.opened, incident.resolved, ticket.created, rollout.halted. Signed with HMAC-SHA256 (X-IQ-Webhook-Signature).</p>
      <table><tbody>${hooks.map(w => `<tr><td><code>${esc(w.url)}</code></td><td>${esc(w.events)}</td><td>${esc(w.last_status || "")}</td></tr>`).join("") || `<tr><td class="empty">None.</td></tr>`}</tbody></table>
      <form class="hstack" id="w-f" style="margin-top:10px"><input class="t" id="w-u" placeholder="https://crm.example/hooks/intentqos" style="flex:1" aria-label="Webhook URL"><button class="btn small" type="submit">Add</button></form></div></section>` : ""}`;
  document.querySelectorAll("[data-close]").forEach(b => b.onclick = async () => { await api("POST", `/v1/privacy/requests/${b.dataset.close}/close`); route(); });
  if ($("u-f")) $("u-f").onsubmit = async (e) => { e.preventDefault(); try { await api("POST", "/v1/admin/users", {username: $("u-n").value, role: $("u-r").value, password: $("u-p").value}); toast("User added."); route(); } catch (err) { toast(err.message); } };
  if ($("w-f")) $("w-f").onsubmit = async (e) => { e.preventDefault(); await api("POST", "/v1/admin/webhooks", {url: $("w-u").value, events: "*"}); route(); };
}};

/* ------------------------------------------------------------------ sign-in */
const ROLE_BLURB = {admin: "Everything, including users, rollouts and integrations", noc: "Fleet health, incidents, notifications and rollouts",
  support: "Find a home, see what is wrong, act on it, answer tickets", viewer: "Read-only: look around without changing anything"};
const ART = `<svg class="bg" width="420" height="420" viewBox="0 0 420 420" aria-hidden="true">${Array.from({length: 14 * 14}, (_, i) => { const x = i % 14, y = Math.floor(i / 14); const c = ["#2B3A75", "#33448A", "#4FA272", "#C9A227", "#E07B26"][(x * 7 + y * 3 + (x * y) % 5) % 5]; return `<rect x="${x * 30}" y="${y * 30}" width="24" height="24" rx="3" fill="${c}" opacity="${(0.25 + ((x + y) % 4) * .15).toFixed(2)}"/>`; }).join("")}</svg>`;
async function renderLogin(msg) {
  let q = {enabled: false, users: []};
  try { q = await fetch("/v1/auth/quick-roles").then((r) => r.json()); } catch (e) {}
  const art = `<div class="art">${ART}<div style="display:flex;align-items:center;gap:10px;position:relative"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="6" fill="#F2A93B"/><path d="M8 19c3-6 13-6 16 0 M11 15.5c2.5-3.5 7.5-3.5 10 0" stroke="#1D2B5E" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="16" cy="21.5" r="2.2" fill="#1D2B5E"/></svg><b style="font-size:17px">IntentQoS Fleet</b></div>
    <div style="position:relative;display:grid;gap:12px"><h1>Every home's connection, and what to do when one goes wrong.</h1><p>Network operations and the support desk share one view of the gateways: live quality, alerts grouped into network incidents, a diagnosis for each home, and signed changes rolled out in stages.</p></div></div>`;
  if (q.enabled) {
    $("root").innerHTML = `<div class="login">${art}<div class="side"><h2>Choose a role</h2>
      <p class="labnote">Lab sign-in, accepted only from this computer. A real deployment uses staff accounts with passwords or single sign-on.</p>
      ${q.users.map((u) => `<button class="role" type="button" data-u="${esc(u.username)}"><span class="av">${esc(initials(u.name || u.username))}</span><b>${esc((u.name || u.username).replace(/\s*\(.*\)/, ""))}, ${esc(u.role)}</b><span>${esc(ROLE_BLURB[u.role] || "")}</span></button>`).join("")}
      <p class="sub" id="lm" style="margin:0;color:var(--crit)" role="alert">${esc(msg || "")}</p></div></div>`;
    document.querySelectorAll("[data-u]").forEach((b) => b.onclick = async () => {
      try { await api("POST", "/v1/auth/quick", {username: b.dataset.u}); boot(); } catch (err) { $("lm").textContent = err.message; }
    });
    return;
  }
  $("root").innerHTML = `<div class="login">${art}<form class="side" id="lf"><h2>Sign in</h2>
    <label class="f" for="lu">User name<input class="t" id="lu" autocomplete="username" required></label>
    <label class="f" for="lp">Password<input class="t" id="lp" type="password" autocomplete="current-password" required></label>
    <p class="sub" id="lm" style="margin:0;color:var(--crit)" role="alert">${esc(msg || "")}</p><button class="btn primary" type="submit" style="justify-content:center;height:34px">Sign in</button>
    <p class="labnote">Lab accounts are in <code>controller/data/lab-credentials.txt</code>. Five wrong passwords lock the account for 15 minutes.</p></form></div>`;
  $("lf").onsubmit = async (e) => {
    e.preventDefault();
    try { await api("POST", "/v1/auth/login", {username: $("lu").value, password: $("lp").value}); boot(); }
    catch (err) { $("lm").textContent = err.message; }
  };
}
async function boot() {
  try { const t = localStorage.getItem("iqf-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  try {
    const me = await api("GET", "/v1/auth/me");
    S.me = me.user; S.perms = new Set(me.perms); S.brand = me.brand || {}; S.lab = !!me.lab;
    renderShell(); route();
  } catch (e) { if (!S.me) renderLogin(); }
}
boot();
</script>
