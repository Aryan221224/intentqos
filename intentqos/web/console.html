<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home gateway</title>
<style>
/* The gateway's own console: what runs on the router at http://192.168.1.1:8080/.
   An instrument panel for the QoS engine: graphite surfaces by default (light on request), Barlow
   with Barlow Semi Condensed for readings, tabs across the top like router firmware. The memorable
   element is the mixing desk on Monitor: one channel strip per traffic class and direction, its level
   the class's throughput, the white mark its guaranteed floor, the reading under it the queue delay. */
@font-face{font-family:"Barlow";src:url(/fonts/barlow-400.woff) format("woff");font-weight:400;font-display:swap}
@font-face{font-family:"Barlow";src:url(/fonts/barlow-500.woff) format("woff");font-weight:500;font-display:swap}
@font-face{font-family:"Barlow";src:url(/fonts/barlow-600.woff) format("woff");font-weight:600 700;font-display:swap}
@font-face{font-family:"Barlow SC";src:url(/fonts/barlow-sc-500.woff) format("woff");font-weight:500;font-display:swap}
@font-face{font-family:"Barlow SC";src:url(/fonts/barlow-sc-600.woff) format("woff");font-weight:600 700;font-display:swap}
:root{
  --paper:#121922; --panel:#19222D; --panel-2:#1E2935; --sunk:#0F151D; --ink:#E6ECF2; --ink2:#9AABBD; --ink3:#6C7D90;
  --rule:#2A3644; --track:#243040; --road:#0D131A; --road-ink:#E6ECF2; --road-rule:#222D3A;
  --intent:#A792FF; --voice:#34C98E; --video:#5AA2FF; --besteffort:#EDB04A; --bulk:#F06F9B;
  --ok:#41CF8E; --ok-bg:#12301F; --warn:#EDB04A; --warn-bg:#33270F; --alert:#FF7059; --alert-bg:#3A1814;
  --accent:#F2A93B; --accent-ink:#2B1C00; --focus:#F2A93B;
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"Barlow SC","Barlow",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --r:8px; color-scheme:dark;
}
:root[data-theme="light"]{
  --paper:#EEF1F5; --panel:#FFFFFF; --panel-2:#F6F8FA; --sunk:#E6EAF0; --ink:#17202B; --ink2:#556375; --ink3:#7F8C9C;
  --rule:#D5DBE3; --track:#E3E8EF; --road:#16202B; --road-ink:#E6ECF2; --road-rule:#26313D;
  --intent:#7D66E6; --voice:#12976A; --video:#2F78E0; --besteffort:#C98500; --bulk:#D24C7C;
  --ok:#1F8550; --ok-bg:#E2F3E9; --warn:#9A6200; --warn-bg:#FBF0D8; --alert:#C2361D; --alert-bg:#FCE7E2;
  --accent:#E8971F; --accent-ink:#2B1C00; --focus:#C77D00; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
.num,td.n,.tabular{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell: device bar, tabs, page title ---------- */
.app{min-height:100%;display:flex;flex-direction:column}
.devbar{display:flex;align-items:center;gap:14px 20px;flex-wrap:wrap;padding:10px 24px;background:var(--road);color:var(--road-ink);border-bottom:1px solid var(--road-rule)}
.devid{display:flex;align-items:center;gap:11px}
.devid b{font-family:var(--cond);font-size:19px;font-weight:600;letter-spacing:.01em}
.devid small{display:block;color:#93A4B6;font-size:12.5px}
.wan{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:#93A4B6;border-left:1px solid var(--road-rule);padding-left:18px}
.wan b{display:block;font-family:var(--cond);font-size:16px;font-weight:600;color:var(--road-ink)}
.devbar .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:5px;padding:2px 9px;font-size:12.5px;font-weight:600;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.devbar .pill{background:rgba(255,255,255,.06);color:#B9C6D4}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.alert{background:var(--alert-bg);color:var(--alert)}
.devbar .pill.ok{background:rgba(65,207,142,.14);color:#6EE0AB}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.live .dot{animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.25}}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;flex:none;background:var(--panel)}
.seg button{border:0;background:transparent;padding:4px 11px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink2);border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.devbar .seg{border-color:var(--road-rule);background:transparent}
.devbar .seg button{color:#B9C6D4;border-color:var(--road-rule)}
.devbar .seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.iconbtn{border:1px solid var(--road-rule);background:transparent;border-radius:6px;width:30px;height:30px;display:inline-grid;place-items:center;cursor:pointer;color:#B9C6D4}
nav.views{display:flex;gap:2px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:5}
nav.views a{display:flex;align-items:center;gap:7px;padding:11px 12px 10px;color:var(--ink2);text-decoration:none;font-weight:600;font-size:14.5px;border-bottom:2.5px solid transparent;white-space:nowrap}
nav.views a:hover{color:var(--ink)}
nav.views a[aria-current=page]{color:var(--ink);border-bottom-color:var(--accent)}
nav.views a .k{font-family:var(--mono);font-size:10.5px;color:var(--ink3);border:1px solid var(--rule);border-radius:3px;padding:0 4px;line-height:1.4}
nav.views .grp{width:1px;background:var(--rule);margin:10px 8px;flex:none}
nav.views .grp:first-child{display:none}
.pagebar{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;padding:18px 24px 0;max-width:1480px;width:100%}
.pagebar h1{font-family:var(--cond);font-size:26px;font-weight:600}
.pagebar .ctx{color:var(--ink2);font-size:13.5px;min-width:0}
.content{padding:16px 24px 60px;display:grid;gap:18px;max-width:1480px;width:100%}
.replaybar{background:var(--intent);color:#fff;padding:7px 24px;font-size:13.5px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.replaybar b{font-weight:700}
.replaybar .scrub{flex:1;min-width:140px;accent-color:#fff}
.replaybar button{border:1px solid rgba(255,255,255,.8);background:transparent;color:#fff;border-radius:5px;padding:2px 12px;cursor:pointer;font-weight:600}
#m-banner:empty,.content>div:empty{display:none}
#m-banner{display:grid;gap:8px}
.gbanner:empty{display:none}
.gbanner{margin:14px 24px 0;background:var(--alert-bg);color:var(--alert);border-radius:var(--r);padding:12px 16px;font-weight:500}
.banner{border-radius:var(--r);padding:10px 14px;font-weight:500}
.banner.warn{background:var(--warn-bg);color:var(--warn)} .banner.alert{background:var(--alert-bg);color:var(--alert)}
.foot{color:var(--ink3);font-size:12px;padding:0 24px 20px;display:flex;gap:16px;flex-wrap:wrap}

/* ---------- building blocks ---------- */
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);padding:16px 18px;min-width:0}
.panel>h2,.sect>h2{font-size:17px}
.sub{color:var(--ink2);font-size:13.5px;margin:2px 0 12px;max-width:85ch}
.cols{display:grid;gap:18px;grid-template-columns:repeat(2,minmax(0,1fr))}
.cols.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols.wide-l{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.cols.wide-r{grid-template-columns:minmax(0,1fr) minmax(0,1.55fr)}
.hstack{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.hstack .sp{flex:1}
a.btn{text-decoration:none;color:inherit;display:inline-flex}
.btn{border:1px solid var(--rule);background:var(--panel-2);border-radius:6px;padding:5px 13px;font-weight:600;cursor:pointer;font-size:14px;white-space:nowrap;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{border-color:color-mix(in srgb,var(--alert) 55%,var(--rule));color:var(--alert)}
.btn.quiet{background:transparent}
.btn.small{padding:2px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{border:1px solid var(--rule);background:var(--panel-2);border-radius:6px;padding:4px 11px;cursor:pointer;font-weight:600;font-size:13.5px}
.chipbtn[aria-pressed=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--panel));color:var(--ink)}
.chipbtn:disabled{opacity:.45;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2);font-weight:500;min-width:0}
input.t,select.t{border:1px solid var(--rule);border-radius:6px;padding:6px 9px;background:var(--sunk);color:var(--ink);min-width:0;width:100%}
input.t:focus,select.t:focus{border-color:var(--accent);outline:0}
.form{display:grid;gap:12px}
.form .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.cls{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;white-space:nowrap}
.cls::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--c)}
.muted{color:var(--ink2)} .faint{color:var(--ink3)}
.small{font-size:12.5px}
.empty{color:var(--ink2);font-size:14px;padding:10px 0}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--ink2);border-bottom:1px solid var(--rule);padding:6px 8px;white-space:nowrap;font-size:12.5px}
td{border-bottom:1px solid var(--rule);padding:6px 8px;vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap;font-family:var(--cond);font-size:15px}
th.n{font-family:var(--sans);font-size:12.5px}
tr.best td.n.b{font-weight:700}
.conf{display:inline-block;width:52px;height:6px;border-radius:3px;background:var(--track);vertical-align:middle;margin-right:6px;position:relative;overflow:hidden}
.conf i{position:absolute;inset:0 auto 0 0;background:var(--ink2)}
.conf.lo i{background:var(--warn)}
.scroll{max-height:440px;overflow:auto}
pre.mono{font-family:var(--mono);font-size:12px;line-height:1.5;background:var(--sunk);border-radius:6px;padding:12px;overflow:auto;max-height:440px;margin:0;white-space:pre}
code{font-family:var(--mono);font-size:12.5px;background:var(--sunk);border-radius:4px;padding:1px 5px}
canvas{width:100%;display:block}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;background:var(--c);vertical-align:middle;margin-right:5px}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--c) 0 4px,transparent 4px 7px)}

/* ---------- monitor ---------- */
.status-strip{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center}
.grade{width:64px;height:64px;border-radius:10px;display:grid;place-items:center;font-family:var(--cond);font-weight:600;font-size:34px;color:#0D131A;background:var(--c,var(--ok))}
.status-strip h2{font-family:var(--cond);font-size:24px;font-weight:600}
.status-strip .why{color:var(--ink2);font-size:14px;margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;border:1px solid var(--rule);border-radius:var(--r);background:var(--panel);overflow:hidden}
.kpi{padding:11px 14px 8px;border-right:1px solid var(--rule);min-width:0}
.kpi:last-child{border-right:0}
.kpi .l{font-size:13px;color:var(--ink2);font-weight:500}
.kpi .v{font-family:var(--cond);font-size:30px;font-weight:600;line-height:1.1;margin-top:2px;white-space:nowrap}
.kpi .v small{font-size:14px;font-weight:500;color:var(--ink2);margin-left:3px}
.kpi .d{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi canvas{height:30px;margin-top:6px}
.road{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.roadhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.roadhead h2{font-size:17px}
/* mixing desk */
.lanes{background:var(--road);border:1px solid var(--road-rule);border-radius:10px;padding:14px 12px 10px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.ch{display:grid;grid-template-rows:auto 150px auto auto;gap:6px;justify-items:center;text-align:center;color:var(--road-ink)}
.ch .val{font-family:var(--cond);font-size:22px;font-weight:600;line-height:1}
.ch .val small{display:block;font-size:11px;font-weight:500;color:#8496A8;font-family:var(--sans)}
.meter{width:30px;height:150px;border-radius:5px;background:repeating-linear-gradient(to top,#1B2532 0 3px,#151E29 3px 6px);position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px var(--road-rule)}
.meter .lvl{position:absolute;left:3px;right:3px;bottom:3px;border-radius:3px;background:var(--c);transition:height .6s ease;max-height:calc(100% - 6px)}
.meter .fl{position:absolute;left:-2px;right:-2px;height:2px;background:#F4F7FA;box-shadow:0 0 0 1px #0D131A}
.ch .q{font-size:12px;color:#93A4B6;white-space:nowrap;line-height:1.3}
.ch .q b{color:var(--road-ink);font-family:var(--cond);font-weight:600;font-size:14px}
.ch .q.hot b{color:#FFB199}
.ch .nm{font-size:12.5px;font-weight:600;border-top:3px solid var(--c);padding-top:4px;width:100%;color:#C9D4DF}
.chart{height:200px} .chart.sm{height:150px}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:0}
.timeline li{display:grid;grid-template-columns:62px 92px minmax(0,1fr);gap:10px;padding:6px 0;border-bottom:1px solid var(--rule);font-size:13.5px;align-items:baseline}
.timeline time{font-family:var(--mono);font-size:12px;color:var(--ink3)}
.timeline .kind{font-size:12.5px;font-weight:600;color:var(--ink2)}
.timeline .warn{color:var(--warn)} .timeline .error{color:var(--alert)}

/* ---------- traffic ---------- */
.devgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.dev{border:1px solid var(--rule);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:40px minmax(0,1fr);gap:3px 12px;background:var(--panel-2)}
.dev .ic{grid-row:span 3;width:40px;height:40px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;color:var(--ink2)}
.dev .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dev .act{font-size:13px;color:var(--ink2)}
.dev .rt{font-family:var(--cond);font-size:14px;color:var(--ink2)}
.dev .bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--track);overflow:hidden;display:flex;margin-top:6px}
.dev .bar i{height:100%;background:var(--c)}
.dev.boost{border-color:var(--intent);box-shadow:inset 0 0 0 1px var(--intent)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:0 6px;border-radius:4px;background:var(--sunk);color:var(--ink2)}
.tag.boost{background:var(--intent);color:#14102A}
.tag.unsure{background:var(--warn-bg);color:var(--warn)}
.tag.user{background:var(--ok-bg);color:var(--ok)}
select.relabel{border:1px solid var(--rule);background:var(--sunk);border-radius:5px;padding:2px 4px;font-size:12.5px}
.metric-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:14px}
.metric{border-left:3px solid var(--c,var(--rule));padding:2px 0 2px 10px}
.metric .v{font-family:var(--cond);font-size:24px;font-weight:600;line-height:1.1}
.metric .l{font-size:12.5px;color:var(--ink2)}
.f1bars{display:grid;gap:6px}
.f1bars .r{display:grid;grid-template-columns:96px minmax(0,1fr) 46px;gap:8px;align-items:center;font-size:13px}
.f1bars .b{height:14px;position:relative;background:var(--track);border-radius:3px}
.f1bars .b i{position:absolute;left:0;height:6px;border-radius:2px}
.f1bars .b i.ml{top:1px;background:var(--ink)} .f1bars .b i.ru{bottom:1px;background:var(--ink3)}
table.cm td{text-align:center;font-family:var(--cond);font-size:13px;padding:5px 4px;border:1px solid var(--rule)}
table.cm th{font-size:12px;border-bottom:0;text-align:center;white-space:nowrap}

/* ---------- link ---------- */
.dircard{display:grid;gap:10px}
.bignums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bignums div .v{font-family:var(--cond);font-size:30px;font-weight:600;line-height:1}
.bignums div .l{font-size:12.5px;color:var(--ink2)}
.range{position:relative;height:30px;margin:6px 0 14px}
.range .bar{position:absolute;top:12px;left:0;right:0;height:6px;border-radius:3px;background:var(--track)}
.range .ok{position:absolute;top:12px;height:6px;background:var(--rule);border-radius:3px}
.range .mk{position:absolute;top:4px;width:3px;height:22px;border-radius:2px;transform:translateX(-50%)}
.range .lbl{position:absolute;top:30px;font-size:11.5px;color:var(--ink2);transform:translateX(-50%);white-space:nowrap}
.statepill{font-size:13px}
.preset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.toggle{border:1px solid var(--rule);border-radius:8px;padding:9px 11px;text-align:left;background:var(--panel-2);cursor:pointer;display:grid;gap:2px}
.toggle b{font-size:14px}
.toggle span{font-size:12px;color:var(--ink2)}
.toggle[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.toggle[aria-pressed=true] span{color:var(--ok)}

/* ---------- policy ---------- */
.gauge{height:10px;border-radius:5px;background:var(--track);overflow:hidden}
.gauge i{display:block;height:100%;background:var(--ink2)}
.ctrl{display:grid;gap:10px}
.ctrl .item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule)}
.ctrl .item:last-child{border-bottom:0}
.ctrl .item b{display:block}
.ctrl .item span{font-size:13px;color:var(--ink2)}
.log li{grid-template-columns:62px 78px minmax(0,1fr)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin-bottom:10px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:6px 12px;font-weight:600;color:var(--ink2);border-bottom:2.5px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}

/* ---------- prioritise ---------- */
.devpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.devpick button{border:1px solid var(--rule);background:var(--panel-2);border-radius:8px;padding:8px 10px;display:flex;gap:9px;align-items:center;cursor:pointer;text-align:left;min-width:0}
.devpick button span{min-width:0;display:grid}
.devpick button b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.devpick button small{font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.devpick button[aria-pressed=true]{border-color:var(--intent);box-shadow:inset 0 0 0 1px var(--intent)}
.preview{border-radius:var(--r);background:var(--sunk);padding:12px 14px;display:grid;gap:8px;font-size:14px}
.preview .fit{height:10px;border-radius:5px;background:var(--track);overflow:hidden}
.preview .fit i{display:block;height:100%;background:var(--intent)}
.lease{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--rule);align-items:center}
.lease:last-child{border-bottom:0}
.lease .who{font-weight:600}
.lease .meta{font-size:13px;color:var(--ink2)}
.lease .clock{font-family:var(--cond);font-size:24px;font-weight:600;text-align:right}
.lease .tl{grid-column:1/-1;height:4px;border-radius:2px;background:var(--track);overflow:hidden}
.lease .tl i{display:block;height:100%;background:var(--intent)}
.as{font-size:12.5px;font-weight:600;padding:1px 8px;border-radius:4px;display:inline-block}
.as.satisfied{background:var(--ok-bg);color:var(--ok)} .as.degraded{background:var(--warn-bg);color:var(--warn)}
.as.infeasible{background:var(--alert-bg);color:var(--alert)} .as.pending{background:var(--sunk);color:var(--ink2)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.mode{border:1px solid var(--rule);border-radius:var(--r);padding:12px;display:grid;gap:6px;align-content:start;background:var(--panel-2)}
.mode b{font-family:var(--cond);font-size:18px;font-weight:600}
.mode p{margin:0;font-size:13px;color:var(--ink2)}
.mode .hstack{margin-top:4px}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days button{width:36px;padding:4px 0;border:1px solid var(--rule);background:var(--panel-2);border-radius:6px;cursor:pointer;font-weight:600;font-size:12.5px}
.days button[aria-pressed=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--panel))}

/* ---------- experiments ---------- */
.scen{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.sc{border:1px solid var(--rule);border-radius:var(--r);padding:14px;display:grid;gap:8px;align-content:start;background:var(--panel-2);cursor:pointer;text-align:left}
.sc[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.sc .id{font-family:var(--mono);font-size:12px;color:var(--ink3)}
.sc b{font-family:var(--cond);font-size:19px;font-weight:600;line-height:1.2}
.sc p{margin:0;font-size:13px;color:var(--ink2)}
.progress{height:10px;border-radius:5px;background:var(--track);overflow:hidden}
.progress i{display:block;height:100%;background:var(--video);transition:width .5s}
.arm{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.arm::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.dots{position:relative;height:20px;min-width:120px}
.dots i{position:absolute;top:7px;width:6px;height:6px;border-radius:50%;background:var(--c);opacity:.55;transform:translateX(-50%)}
.dots b{position:absolute;top:2px;width:3px;height:16px;border-radius:2px;background:var(--c);transform:translateX(-50%)}
.figs{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;max-width:1100px}
.figs img{width:100%;border:1px solid var(--rule);border-radius:6px;background:#fff}
.verdict{font-size:12.5px;font-weight:600}
.verdict.good{color:var(--ok)} .verdict.bad{color:var(--alert)} .verdict.na{color:var(--ink3)}

/* ---------- system ---------- */
.arch{width:100%;height:auto;display:block}
.arch text{font-family:var(--sans);fill:var(--ink)}
.arch .layer{fill:var(--sunk)}
.arch .lt{font-size:11.5px;font-weight:600;fill:var(--ink2)}
.arch .node rect{fill:var(--panel-2);stroke:var(--rule);stroke-width:1.5}
.arch .node.ok rect{stroke:var(--ok)} .arch .node.warn rect{stroke:var(--warn)} .arch .node.bad rect{stroke:var(--alert)}
.arch .node .nt{font-size:13px;font-weight:600}
.arch .node .ns{font-size:11px;fill:var(--ink2)}
.arch .node circle{fill:var(--ink3)}
.arch .node.ok circle{fill:var(--ok)} .arch .node.warn circle{fill:var(--warn)} .arch .node.bad circle{fill:var(--alert)}
.arch .edge{stroke:var(--ink3);stroke-width:1.4;fill:none}
.arch .flow{stroke:var(--video);stroke-width:2;fill:none;stroke-dasharray:4 6;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
.checks{list-style:none;margin:0;padding:0}
.checks li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:4px 10px;padding:9px 0;border-bottom:1px solid var(--rule)}
.checks .ic{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;font-weight:700;font-size:13px;color:#0D131A;background:var(--ok)}
.checks .ic.no{background:var(--alert)}
.checks b{font-weight:600}
.checks .det{grid-column:2;font-size:12.5px;color:var(--ink2);overflow-wrap:anywhere}
.caps{display:flex;flex-wrap:wrap;gap:6px}
.lim{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px}
.lim li{max-width:72ch}

/* ---------- household ---------- */
.hh-hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;padding:22px;border-radius:12px;background:var(--road);color:var(--road-ink);border:1px solid var(--road-rule)}
.hh-hero .grade{width:88px;height:88px;font-size:44px;border-radius:14px}
.hh-hero h2{font-family:var(--cond);font-size:30px;line-height:1.1;font-weight:600}
.hh-hero p{margin:6px 0 0;color:#9FB1C3;max-width:60ch}
.hh-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.hh-edit{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px 12px;align-items:center;border:1px solid var(--rule);border-radius:var(--r);padding:12px;background:var(--panel-2)}
.hh-edit .row2{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,9,14,.6);display:grid;place-items:center;z-index:50;padding:16px}
.dialog{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:20px;max-width:460px;width:100%;display:grid;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.dialog h3{font-family:var(--cond);font-size:21px;font-weight:600}
.dialog p{margin:0;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-weight:500;z-index:60;max-width:min(560px,calc(100% - 32px));box-shadow:0 10px 30px rgba(0,0,0,.3)}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpi:nth-child(3n){border-right:0} .kpi:nth-child(-n+3){border-bottom:1px solid var(--rule)}
  .cols.c3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:920px){
  .devbar,.pagebar,.content,.replaybar{padding-left:14px;padding-right:14px}
  nav.views{padding:0 8px}
  .wan{border-left:0;padding-left:0;order:5;width:100%}
  .cols,.cols.c3,.cols.wide-l,.cols.wide-r,.road{grid-template-columns:minmax(0,1fr)}
  nav.views a .k{display:none}
}
@media (max-width:560px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi{border-right:1px solid var(--rule)!important;border-bottom:1px solid var(--rule)}
  .kpi:nth-child(2n){border-right:0!important}
  .status-strip{grid-template-columns:auto minmax(0,1fr)}
  .status-strip .act{grid-column:1/-1}
  .lanes{gap:4px;padding:12px 6px 8px}
  .ch .val{font-size:18px} .meter{width:22px}
  .ch .nm{font-size:11px}
  .bignums div .v{font-size:24px}
  .timeline li{grid-template-columns:58px minmax(0,1fr)}
  .timeline .kind{display:none}
  .hh-hero{grid-template-columns:minmax(0,1fr)}
  .hh-edit .row2{grid-template-columns:minmax(0,1fr)}
}
</style>

<body>
<div class="app">
  <div class="replaybar" id="replaybar" hidden>
    <b>Replay of a recorded session</b><span id="rp-what">Recorded live on the namespace testbed.</span>
    <span id="rp-ch" class="tabular" style="font-weight:600"></span><button id="rp-play" type="button">Pause</button>
    <input class="scrub" id="rp-scrub" type="range" min="0" max="0" value="0" aria-label="Replay position">
    <span id="rp-pos" class="tabular">0:00</span>
  </div>
  <header class="devbar">
    <div class="devid"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#F2A93B"/><rect x="7" y="9" width="3" height="14" rx="1.5" fill="#0D131A"/><rect x="12.5" y="13" width="3" height="10" rx="1.5" fill="#0D131A"/><rect x="18" y="7" width="3" height="16" rx="1.5" fill="#0D131A"/><rect x="23.5" y="16" width="3" height="7" rx="1.5" fill="#0D131A"/></svg>
      <div><b>Home gateway</b><small id="foot-ver">IntentQoS</small></div></div>
    <div class="wan" id="wan"></div>
    <span class="sp"></span>
    <span class="pill" id="conn"><span class="dot"></span><span>Connecting</span></span>
    <div class="seg" role="group" aria-label="Audience">
      <button type="button" id="aud-op" aria-pressed="true">Engineer</button>
      <button type="button" id="aud-hh" aria-pressed="false">Household</button>
    </div>
    <button type="button" class="iconbtn" id="theme" aria-label="Switch light or dark theme" title="Light or dark">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5a6.5 6.5 0 1 0 0 13z" fill="currentColor"/><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
  </header>
  <nav class="views" id="nav" aria-label="Views"></nav>
  <div id="gbanner" class="gbanner" role="alert"></div>
  <div class="pagebar"><h1 id="view-title">Monitor</h1><span class="ctx" id="ctx"></span></div>
  <main class="content" id="content"></main>
  <footer class="foot"><span id="foot-be"></span><span>Class colours: <span class="cls" style="--c:var(--intent)">Prioritised</span> <span class="cls" style="--c:var(--voice)">Voice and games</span> <span class="cls" style="--c:var(--video)">Video calls</span> <span class="cls" style="--c:var(--besteffort)">Best effort</span> <span class="cls" style="--c:var(--bulk)">Bulk</span></span></footer>
</div>
<div id="overlay"></div>
<script>
"use strict";
/* IntentQoS console. Talks to the engine's REST API (and, when present, the lab server's /lab/* API).
   With no engine reachable and a recording embedded (window.IQ_REPLAY), it plays the recording. */
const R = window.IQ_REPLAY || null;
const BASE = window.IQ_BASE || "";            // set when the console is opened remotely through the controller
const REMOTE = window.IQ_REMOTE || null;
const LANES = ["intent", "voice", "video", "besteffort", "bulk"];
const LANE_NAME = {intent: "Intent", voice: "Voice", video: "Video", besteffort: "Best effort", bulk: "Bulk"};
const LABELS = ["voip", "gaming", "video", "streaming", "web", "bulk"];
const LABEL_NAME = {voip: "Voice call", gaming: "Gaming", video: "Video call", streaming: "Streaming", web: "Browsing", bulk: "Bulk transfer"};
const LABEL_TIN = {voip: "voice", gaming: "voice", video: "video", streaming: "besteffort", web: "besteffort", bulk: "bulk"};
const SOURCE_NAME = {ml: "model", "ml-hold": "model (unsure, kept its class)", rules: "rules", "rules-fallback": "rules (model unsure)", user: "your correction", override: "your correction"};
const STATE_TEXT = {
  bloat: "Queue building at the modem: rate cut", high: "Busy and delay is low: probing upward",
  low: "Light load: drifting back toward the plan rate", idle: "Idle: at the plan rate", blind: "No delay samples: holding (blind mode)",
  static: "Fixed rate (estimator off)"};
const ASSURE = {satisfied: "Working", degraded: "Not meeting its goal", infeasible: "Link too slow for this", pending: "Waiting for traffic"};
const DEVICE_TYPES = ["laptop", "phone", "tv", "console", "desktop", "tablet", "speaker", "camera", "nas", "other"];
const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const ARM_NAME = {noqos: "No QoS", static: "Static QoS", adaptive_rules: "IntentQoS (rules)", adaptive_ml: "IntentQoS (ML)", adaptive_ml_bulk: "IntentQoS (ML), bulk-friendly", adaptive_ml_intent: "IntentQoS + lease"};
const ARM_COLOR = {noqos: "--bulk", static: "--besteffort", adaptive_rules: "--video", adaptive_ml: "--voice", adaptive_ml_bulk: "--video", adaptive_ml_intent: "--intent"};
const DURS = [[1800, "30 min"], [3600, "1 hour"], [7200, "2 hours"], [14400, "4 hours"], [28800, "8 hours"]];

const S = {replay: false, state: null, hist: [], lastT: 0, lab: null, sys: null, setup: null, model: null, inspect: null,
  exps: null, job: null, view: null, household: false, span: 300, token: null, connected: false,
  sim: {leases: [], names: {}, schedules: [], cancelled: new Set()}, rp: {i: 0, playing: true},
  form: {target: null, goal: "low_latency", dur: 3600, prio: 2, requester: "", label: ""}, flowFilter: "all",
  polDir: "down", inspTab: "down", scen: "s2_wan_drop", resSrc: "results", seeds: 1, arms: null, schedDays: [0, 1, 2, 3, 4]};
try { S.token = sessionStorage.getItem("iq-token"); } catch (e) { /* storage unavailable */ }

/* ------------------------------------------------------------------ helpers */
const $ = (id) => document.getElementById(id);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const mbit = (k) => k == null ? "–" : (k / 1000).toFixed(Math.abs(k) >= 10000 ? 0 : 1);
const f1 = (x) => Number.isFinite(x) ? Math.max(0, x).toFixed(1) : "–";
const pct = (x, d = 0) => Number.isFinite(x) ? (x * 100).toFixed(d) + "%" : "–";
const clock = (t) => new Date(t * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false});
const hm = (s) => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h}:${String(m).padStart(2, "0")}:${String(x).padStart(2, "0")}` : `${m}:${String(x).padStart(2, "0")}`; };
const durText = (s) => s >= 3600 ? `${+(s / 3600).toFixed(1)} h` : `${Math.round(s / 60)} min`;
const nowT = () => S.state?.t || Date.now() / 1000;
const devName = (ip) => S.sim.names[ip]?.name || (S.state?.devices || []).find(d => d.ip === ip)?.name || ip;
function set(id, html) { const el = $(id); if (el && el._h !== html) { el.innerHTML = html; el._h = html; } }
function txt(id, t) { const el = $(id); if (el && el.textContent !== t) el.textContent = t; }

const ICON = {
  laptop: '<path d="M5 6h14v9H5z M3 17h18" />', desktop: '<path d="M4 5h16v11H4z M9 20h6 M12 16v4" />',
  phone: '<path d="M8 3h8v18H8z M11 18h2" />', tablet: '<path d="M6 3h12v18H6z M11 18h2" />',
  tv: '<path d="M3 6h18v11H3z M8 21h8" />', console: '<path d="M4 9a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v5a3 3 0 0 1-5 2l-1-1h-4l-1 1a3 3 0 0 1-5-2z M8 10v3 M6.5 11.5h3 M16 11h.01 M14.5 12.5h.01" />',
  speaker: '<path d="M7 3h10v18H7z M12 15m-2.5 0a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0 M12 7h.01" />',
  camera: '<path d="M4 8h12v8H4z M16 11l4-2v6l-4-2" />', nas: '<path d="M5 4h14v7H5z M5 13h14v7H5z M8 7.5h.01 M8 16.5h.01" />',
  other: '<path d="M12 12m-7 0a7 7 0 1 0 14 0a7 7 0 1 0-14 0 M12 8v5 M12 16h.01" />'};
const icon = (t, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[t] || ICON.other}</svg>`;

function toast(msg, ms = 3200) {
  const el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), ms);
}
/* In-page confirmation (browser dialogs are not available everywhere this page runs). */
function ask(title, body, ok = "Confirm", danger = false) {
  return new Promise(res => {
    const o = $("overlay");
    o.innerHTML = `<div class="scrim"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-t">
      <h3 id="dlg-t">${esc(title)}</h3><p>${esc(body)}</p>
      <div class="hstack"><span class="sp"></span><button class="btn quiet" id="dlg-no" type="button">Cancel</button>
      <button class="btn ${danger ? "danger" : "primary"}" id="dlg-ok" type="button">${esc(ok)}</button></div></div></div>`;
    const done = (v) => { o.innerHTML = ""; res(v); };
    $("dlg-no").onclick = () => done(false); $("dlg-ok").onclick = () => done(true); $("dlg-ok").focus();
    o.querySelector(".scrim").addEventListener("keydown", e => { if (e.key === "Escape") done(false); });
  });
}
function askKey(msg) {
  /* The router package turns on api.require_auth: the console then needs the router key, which is
     printed on first start (cat /etc/intentqos/admin.key), like the admin password on a router label. */
  if (S.signing) return S.signing;
  S.signing = new Promise(res => {
    const o = $("overlay");
    o.innerHTML = `<div class="scrim"><form class="dialog" id="tok-f"><h3>Sign in to this gateway</h3>
      <p>Enter the router key. On the router it is in <code>/etc/intentqos/admin.key</code>; the lab and the operator's remote console do not need it.</p>
      <label class="f" for="tok-i">Router key<input class="t" id="tok-i" autocomplete="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX" required style="font-family:var(--mono);letter-spacing:.06em"></label>
      <p class="small" id="tok-m" style="color:var(--alert)" role="alert">${esc(msg || "")}</p>
      <div class="hstack"><span class="sp"></span><button class="btn quiet" id="tok-no" type="button">Cancel</button>
      <button class="btn primary" type="submit">Sign in</button></div></form></div>`;
    $("tok-i").focus();
    const done = (v) => { o.innerHTML = ""; S.signing = null; res(v); };
    $("tok-no").onclick = () => done(false);
    $("tok-f").onsubmit = async (e) => {
      e.preventDefault();
      const r = await fetch(BASE + "/api/session", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({key: $("tok-i").value.trim()})});
      if (r.ok) done(true); else { const d = await r.json().catch(() => ({})); $("tok-m").textContent = d.error || "That key was not accepted."; }
    };
  });
  return S.signing;
}

/* ------------------------------------------------------------------ data source */
async function get(path) {
  if (S.replay) return replayGet(path);
  // A timeout, so a server that went away shows as unreachable instead of freezing the last view.
  let r = await fetch(BASE + path, {cache: "no-store", signal: AbortSignal.timeout(8000)});
  if (r.status === 401 && !REMOTE && await askKey()) r = await fetch(BASE + path, {cache: "no-store"});
  if (!r.ok) throw new Error(`${path}: HTTP ${r.status}`);
  return r.json();
}
async function send(method, path, body) {
  if (S.replay) return replaySend(method, path, body);
  const h = {"Content-Type": "application/json"};
  let r;
  try { r = await fetch(BASE + path, {method, headers: h, body: body ? JSON.stringify(body) : undefined}); }
  catch (e) { toast("The gateway did not answer. Check that the engine is running."); return {status: 0, data: {}}; }
  if (r.status === 403 && REMOTE) { const d = await r.json().catch(() => ({})); toast(d.error || "Your role cannot do this."); return {status: 403, data: d}; }
  if (r.status === 401 && !REMOTE && await askKey()) return send(method, path, body);
  return {status: r.status, data: await r.json().catch(() => ({}))};
}

/* Replay: the recorded engine snapshots are played back one per second. Actions that would change
   the gateway are simulated locally for leases, names and schedules, and refused for everything else. */
function frame() { return R.frames[S.rp.i]; }
function replayGet(path) {
  const f = frame();
  if (path.startsWith("/api/state")) return Promise.resolve(f);
  if (path.startsWith("/api/history")) return Promise.resolve(R.history.filter(r => r.t > S.lastT && r.t <= f.t));
  if (path === "/api/system") return Promise.resolve({...R.system, proc: f.proc});
  if (path === "/api/setup-check") return Promise.resolve(R.setup);
  if (path === "/api/model") return Promise.resolve(R.model);
  if (path === "/api/inspect") return Promise.resolve(R.inspect);
  if (path === "/lab/experiments") return Promise.resolve(R.experiments);
  if (path === "/lab/status") return Promise.resolve(R.lab_at ? R.lab_at[S.rp.i] : R.lab);
  return Promise.reject(new Error("not in recording"));
}
function simPreview(body) {
  const s = S.state, cap = {down: s.estimator.down.rate_kbit * 0.6, up: s.estimator.up.rate_kbit * 0.6};
  const act = activeLeases();
  const dd = +(body.demand_down_kbit || 3000), du = +(body.demand_up_kbit || 2000);
  const useD = act.reduce((a, i) => a + i.granted_down_kbit, 0), useU = act.reduce((a, i) => a + i.granted_up_kbit, 0);
  const gd = Math.min(dd, Math.max(cap.down / (act.length + 1), cap.down - useD)), gu = Math.min(du, Math.max(cap.up / (act.length + 1), cap.up - useU));
  const frac = Math.min(gd / dd, gu / du);
  return {candidate: {granted_down_kbit: Math.round(gd), granted_up_kbit: Math.round(gu), fraction_of_demand: frac},
    others: {}, conflicts: [], boost_capacity_kbit: {down: Math.round(cap.down), up: Math.round(cap.up)}};
}
function simImpact(target) {
  return (S.state.devices || []).filter(d => d.ip !== target && (d.kbps_dn > 1000 || /bulk|stream/.test(d.activity || "")))
    .map(d => ({device: d.name || d.ip, ip: d.ip, kbps_dn: d.kbps_dn, class: Object.keys(d.labels)[0],
      effect: "keeps its floor and borrows only leftover capacity while the lease is active"}));
}
async function replaySend(method, path, body) {
  const refuse = () => { toast("This is a recording, so it cannot change a gateway. Run the engine to try this live."); return {status: 409, data: {replay: true}}; };
  if (method === "POST" && (path.startsWith("/api/intents") || /\/api\/modes\/.+\/activate/.test(path))) {
    let req = {...body};
    if (path.startsWith("/api/modes/")) {

}

  txt("foot-ver", `IntentQoS ${s.version}, running ${hm(s.uptime_s)}`); txt("foot-be", `LAN ${c.lan}, WAN ${c.wan}`);
  const e = s.estimator;
  set("wan", `<span><b>${c.nominal_down_mbit}/${c.nominal_up_mbit}</b>plan, Mbit/s</span><span><b>${mbit(e.down.rate_kbit)}/${mbit(e.up.rate_kbit)}</b>shaping now</span><span><b>${mbit(e.down.achieved_kbit)}/${mbit(e.up.achieved_kbit)}</b>in use</span><span><b>${esc(s.grade?.overall?.grade || "–")}</b>grade</span>`);
  try { VIEWS[S.view]?.update?.call(VIEWS[S.view]); } catch (e) { console.error(e); }
}
function setConn(ok, label) {
  const el = $("conn"); el.className = "pill " + (ok ? "ok live" : "alert");
  el.innerHTML = `<span class="dot"></span><span>${esc(label)}</span>`;
}

let pollBusy = false, tick = 0;
async function poll() {
  if (pollBusy) return; pollBusy = true;
  try {
    if (S.replay) {
      S.state = await get("/api/state");
      const rows = await get("/api/history");
      if (rows.length) { S.hist = S.hist.concat(rows); S.lastT = rows[rows.length - 1].t; }
      S.lab = await get("/lab/status").catch(() => null);
      setConn(true, "Replay");
      updateReplayBar();
    } else {
      S.state = await get("/api/state");
      const rows = await get("/api/history?since=" + S.lastT);
      if (rows.length) { S.hist = S.hist.concat(rows).slice(-2000); S.lastT = rows[rows.length - 1].t; }
      if (tick % 3 === 0 && S.labTried !== false) S.lab = await get("/lab/status").catch(() => { S.labTried = false; return null; });
      if (tick % 5 === 0 && S.view === "system") S.sys = await get("/api/system").catch(() => S.sys);
      if (tick % 5 === 0 && S.view === "experiments" && S.lab?.job?.state === "running") S.exps = await get("/lab/experiments").catch(() => S.exps);
      setConn(true, S.state.paused ? "Live · paused" : "Live");
    }
    S.connected = true; tick++;
    set("gbanner", S.state.error ? `The engine's control loop is failing and keeps the last good policy: ${esc(S.state.error)}` : ""); $("content").style.opacity = "";
    render();
  } catch (e) {
    S.connected = false;
    if (!S.replay && R) { startReplay(); pollBusy = false; return poll(); }
    setConn(false, "Engine not reachable"); $("content").style.opacity = ".55";
    const lab = S.labTried === false ? null : await get("/lab/status").catch(() => null);
    set("gbanner", lab?.lab ? `The engine is not running. ${lab.engine.watchdog ? "The watchdog has put the gateway in its safe state, so traffic keeps flowing with fair sharing." : "The watchdog is not running either."} Restart it from the lab: <button class="btn small" type="button" id="x-restart">Restart engine</button>`
      : "The engine is not answering. If it crashed, the watchdog keeps the gateway in a safe state. This page retries every second.");
    if (!S.state) $("content").innerHTML = `<section class="panel"><h2>Waiting for the engine</h2><p class="sub">This console talks to the IntentQoS engine's API. Start it with <code>sudo make engine</code> (or the whole lab with <code>sudo make lab</code>); this page retries every second.</p></section>`;
  } finally { pollBusy = false; }
}

/* ------------------------------------------------------------------ replay */
function startReplay() {
  S.replay = true; S.hist = []; S.lastT = 0; S.rp.i = 0;
  $("replaybar").hidden = false;
  txt("rp-what", R.description || "Recorded live on the namespace testbed.");
  $("rp-scrub").max = R.frames.length - 1;
  S.sys = R.system; S.modes = R.modes; S.span = 120;
}
function seek(i) {
  S.rp.i = Math.max(0, Math.min(R.frames.length - 1, i));
  S.hist = []; S.lastT = 0; S.cpuHist = [];
}
function updateReplayBar() {
  $("rp-scrub").value = S.rp.i;
  txt("rp-pos", `${hm(S.rp.i)} / ${hm(R.frames.length - 1)}`);
  const ch = (R.marks || []).filter(m => m.i <= S.rp.i).pop();
  txt("rp-ch", ch ? `Now: ${ch.what}` : "");
  $("rp-play").textContent = S.rp.playing ? "Pause" : "Play";
}
function replayTick() {
  if (!S.replay || !S.rp.playing) return;
  if (S.rp.i >= R.frames.length - 1) seek(0); else S.rp.i++;
}

/* ------------------------------------------------------------------ global events */
document.addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.span) { S.span = +b.dataset.span; document.querySelectorAll("[data-span]").forEach(x => x.setAttribute("aria-pressed", +x.dataset.span === S.span)); render(); return; }
  if (b.dataset.cancel) {
    if (await ask("End this priority now?", `${devName(activeLeases().find(i => i.id === b.dataset.cancel)?.target)} goes back to sharing the link normally.`, "End now")) { await send("DELETE", "/api/intents/" + b.dataset.cancel); toast("Priority ended."); poll(); }
    return;
  }
  if (b.dataset.mode) return startMode(b.dataset.mode);
  if (b.dataset.offer) { const r = await send("POST", `/api/offers/${b.dataset.offer}/accept`, {}); toast(r.status === 200 && r.data.ok !== false ? "Prioritised." : (r.data.reason || r.data.error || "Could not start it.")); poll(); return; }
  if (b.dataset.offerNo) { await send("POST", `/api/offers/${b.dataset.offerNo}/dismiss`, {}); poll(); return; }
  if (b.id === "nl-go" || b.id === "nl-ok") {
    const text = $("nl-text").value.trim(); if (!text) return;
    const r = await send("POST", "/api/intents/parse", {text, confirm: b.id === "nl-ok"});
    const d = r.data || {};
    if (b.id === "nl-ok") { set("nl-out", d.ok ? "Done. It ends by itself." : esc(d.reason || d.error || "Not started.")); if (d.ok) { $("nl-text").value = ""; poll(); } return; }
    set("nl-out", d.ok ? `I understood: <b>${esc(d.understood)}</b> <button class="btn small" type="button" id="nl-ok">Start it</button>` : esc(d.reason || d.error || "I could not understand that."));
    return;
  }
  if (b.dataset.unsched) { await send("DELETE", "/api/schedules/" + b.dataset.unsched); poll(); return; }
  if (b.dataset.f) { S.flowFilter = b.dataset.f; document.querySelectorAll("[data-f]").forEach(x => x.setAttribute("aria-pressed", x.dataset.f === S.flowFilter)); render(); return; }
  if (b.dataset.dir) { S.polDir = b.dataset.dir; document.querySelectorAll("[data-dir]").forEach(x => x.setAttribute("aria-pressed", x.dataset.dir === S.polDir)); render(); return; }
  if (b.dataset.tab) { S.inspTab = b.dataset.tab; document.querySelectorAll("[data-tab]").forEach(x => x.setAttribute("aria-selected", x.dataset.tab === S.inspTab)); showInspect(); return; }
  if (b.dataset.save) {
    const ip = b.dataset.save, name = $("dn-" + ip).value.trim(), type = $("dt-" + ip).value;
    const r = await send("PUT", "/api/devices/" + ip, {name, type});
    if (r.status === 200) toast(`Saved ${name || ip}.`); else toast(r.data.error || "Not saved.");
    $("d-list")._k = null; poll(); return;
  }
  if (b.dataset.scen) { S.scen = b.dataset.scen; S.arms = null; S.resSrc = "results"; VIEWS.experiments.render(); return; }
  if (b.dataset.seeds) { S.seeds = +b.dataset.seeds; VIEWS.experiments.render(); return; }
  if (b.dataset.arm) { const a = b.dataset.arm; S.arms = S.arms.includes(a) ? S.arms.filter(x => x !== a) : [...S.arms, a]; if (!S.arms.length) S.arms = [a]; VIEWS.experiments.render(); return; }
  if (b.id === "x-go") {
    const cat = S.exps.catalogue.find(c => c.id === S.scen);
    if (!(await ask(`Run ${cat.short}?`, `This takes about ${Math.ceil(S.seeds * S.arms.length * (cat.duration_s + 8) / 60)} minutes. Live traffic and the live engine stop while it runs, then the engine restarts by itself.`, "Run scenario"))) return;
    const r = await send("POST", "/lab/experiments/run", {scenario: S.scen, seeds: S.seeds, arms: S.arms});
    if (r.status === 200) toast("Experiment started. Progress shows below the scenarios."); else toast(r.data.error || "Could not start.", 5000);
    poll(); return;
  }
  if (b.dataset.preset) { const on = b.getAttribute("aria-pressed") === "true"; await send("POST", "/lab/traffic", {preset: b.dataset.preset, action: on ? "stop" : "start"}); S.lab = await get("/lab/status").catch(() => S.lab); render(); return; }
  if (b.dataset.rate) { const [d, u] = b.dataset.rate.split(",").map(Number); await send("POST", "/lab/condition", {down: d, up: u}); toast(`Access link set to ${d}/${u} Mbit/s.`); S.lab = await get("/lab/status").catch(() => S.lab); render(); return; }
  if (b.id === "x-kill") { if (await ask("Crash the engine?", "The engine is killed with SIGKILL, so it cannot clean up. The watchdog should restore the safe state within a few seconds. Restart it afterwards.", "Crash it", true)) { await send("POST", "/lab/engine", {action: "kill"}); toast("Engine killed. Watch the watchdog take over on the System view."); } return; }
  if (b.id === "x-restart") { await send("POST", "/lab/engine", {action: "restart"}); toast("Engine restarting."); return; }
  if (b.id === "x-reset") { await send("POST", "/lab/reset"); toast("All lab traffic stopped and the link is back at the plan rate."); S.lab = await get("/lab/status").catch(() => S.lab); render(); return; }
});
document.addEventListener("change", async (e) => {
  const s = e.target;
  if (s.matches("select.relabel") && s.value) {
    const r = await send("POST", "/api/flows/label", {flow: s.dataset.flow, label: s.value, scope: "app"});
    if (r.status === 200) toast(`Corrected to ${LABEL_NAME[s.value]}. Saved for retraining.`); poll(); return;
  }
  if (s.dataset.fix && s.value) {
    const f = (S.state.flows || []).filter(x => x.lan_ip === s.dataset.fix).sort((a, b) => (b.kbps_dn + b.kbps_up) - (a.kbps_dn + a.kbps_up))[0];
    if (f) { const r = await send("POST", "/api/flows/label", {flow: f.id, label: s.value, scope: "app"}); if (r.status === 200) toast(`Thanks. ${devName(s.dataset.fix)} is now treated as ${LABEL_NAME[s.value].toLowerCase()}.`); }
    s.value = ""; poll(); return;
  }
  if (s.id === "x-src") { S.resSrc = s.value; VIEWS.experiments.results(); }
});
document.addEventListener("submit", async (e) => {
  if (e.target.id === "lab-rate-f") {
    e.preventDefault();
    const d = +$("lab-d").value, u = +$("lab-u").value;
    const r = await send("POST", "/lab/condition", {down: d, up: u});
    if (r.status === 200) toast(`Access link set to ${d}/${u} Mbit/s.`);
    S.lab = await get("/lab/status").catch(() => S.lab); render();
  }
});
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input,select,textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const list = S.household ? HH_VIEWS : OP_VIEWS, n = +e.key;
  if (n >= 1 && n <= list.length) location.hash = list[n - 1];
});
window.addEventListener("hashchange", () => go(location.hash.slice(1)));
$("aud-op").onclick = () => { S.household = false; syncAudience(); location.hash = "monitor"; };
$("aud-hh").onclick = () => { S.household = true; syncAudience(); location.hash = "home"; };
$("theme").onclick = () => {
  const root = document.documentElement, cur = root.dataset.theme || "dark";
  root.dataset.theme = cur === "dark" ? "light" : "dark";
  try { localStorage.setItem("iq-theme", root.dataset.theme); } catch (err) { /* ignore */ }
  render();
};
$("rp-play").onclick = () => { S.rp.playing = !S.rp.playing; updateReplayBar(); };
$("rp-scrub").oninput = (e) => { seek(+e.target.value); poll(); };
window.addEventListener("resize", () => render());
try { const t = localStorage.getItem("iq-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) { /* ignore */ }

if (REMOTE) {
  S.labTried = false;
  document.title = `Home ${REMOTE.home || ""}, gateway console`;
  const rb = document.getElementById("replaybar");
  rb.hidden = false; rb.style.background = "var(--video)";
  rb.innerHTML = `<b>Remote console</b><span>Home ${esc(REMOTE.home || REMOTE.gw)}, live through its router agent. Every change you make is recorded in the audit log.</span>`;
}
(async function boot() {
  if (R && (R.force || location.hash === "#replay")) startReplay();
  const first = location.hash.slice(1);
  S.household = HH_VIEWS.includes(first); syncAudience();
  await poll();
  await go(first);
  setInterval(() => { replayTick(); poll(); }, 1000);
})();
</script>
</body>
